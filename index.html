  /* ══════════════════════════════════════════════════════════════════════════
     THEME VARIABLES
     Defaults = dark theme. `.theme-light` on <html> inverts everything.
     Tailwind config reads rgb(var(--ink-900)) etc so every bg-ink-900 class
     auto-adapts when the theme flips.
     ══════════════════════════════════════════════════════════════════════════ */
  :root, html:not(.theme-light) {
    /* ink scale — darkest (900) to lightest (50), dark theme */
    --ink-900:  11  10   8;
    --ink-800:  19  17  14;
    --ink-700:  28  25  22;
    --ink-600:  40  36  31;
    --ink-500:  58  52  45;
    --ink-400:  91  82  71;
    --ink-300: 139 130 118;
    --ink-200: 191 181 166;
    --ink-100: 232 225 211;
    --ink-50:  245 240 227;
    --ember-500: 245 158  11;
    --ember-400: 251 191  36;
    --ember-300: 252 211  77;
    --ember-600: 217 119   6;
    --ember-700: 180  83   9;

    /* tokens for raw CSS below (non-Tailwind) */
    --theme-body-bg: #0b0a08;
    --theme-body-text: #e8e1d3;
    --theme-body-bg-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(245, 158, 11, 0.06), transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(132, 169, 140, 0.04), transparent 60%);
    --theme-dots: rgba(255,255,255,0.025);
    --theme-scrollbar-thumb: rgba(255,255,255,0.08);
    --theme-scrollbar-thumb-hover: rgba(255,255,255,0.15);
    --theme-range-track: rgba(255,255,255,0.1);
    --theme-ring-glow-focus: rgba(245, 158, 11, 0.18);
    --theme-ring-glow-break: rgba(132, 169, 140, 0.18);
  }

  html.theme-light {
    /* Light theme: warm cream paper feel, not cold grey.
       The ink scale reverses — 900 stays darkest (for text), 50 stays lightest
       (for canvas), but both shift up/down to light-theme values. */
    --ink-900: 245 240 227; /* canvas — warm cream */
    --ink-800: 239 234 220; /* raised surface */
    --ink-700: 231 225 209; /* higher surface */
    --ink-600: 219 211 193; /* borders */
    --ink-500: 185 174 153; /* subtle UI */
    --ink-400: 130 118 101; /* muted text */
    --ink-300:  95  85  72; /* secondary text */
    --ink-200:  55  48  40; /* primary body */
    --ink-100:  35  30  25; /* emphatic body */
    --ink-50:   15  14  12; /* headings / max contrast */
    --ember-500: 217 119   6; /* ember deepened so it pops on cream */
    --ember-400: 245 158  11;
    --ember-300: 251 191  36;
    --ember-600: 180  83   9;
    --ember-700: 146  64   14;

    --theme-body-bg: #f5f0e3;
    --theme-body-text: #1c1916;
    --theme-body-bg-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(245, 158, 11, 0.10), transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(132, 169, 140, 0.08), transparent 60%);
    --theme-dots: rgba(40,36,31,0.06);
    --theme-scrollbar-thumb: rgba(0,0,0,0.15);
    --theme-scrollbar-thumb-hover: rgba(0,0,0,0.25);
    --theme-range-track: rgba(0,0,0,0.08);
    --theme-ring-glow-focus: rgba(217, 119, 6, 0.22);
    --theme-ring-glow-break: rgba(88, 129, 87, 0.22);
  }

  html, body {
    background: var(--theme-body-bg);
    color: var(--theme-body-text);
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  body {
    background-image: var(--theme-body-bg-image);
    background-attachment: fixed;
    min-height: 100vh;
    font-family: 'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Subtle dot grid */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, var(--theme-dots) 1px, transparent 0);
    background-size: 24px 24px;
    pointer-events: none;
    z-index: 0;
  }
  #root { position: relative; z-index: 1; }

    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-feature-settings: 'ss01', 'ss02';
    letter-spacing: -0.04em;

  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--theme-scrollbar-thumb); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--theme-scrollbar-thumb-hover); }

  /* Range input styling */
  input[type=range] {
    -webkit-appearance: none;
    background: transparent;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px;
    background: var(--theme-range-track);
    border-radius: 2px;
  }

    height: 16px;
    width: 16px;
    background: rgb(var(--ember-500));
    border-radius: 50%;
    margin-top: -6px;

    box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15);

// Parse a Spotify share URL into a normalized playlist URL
function normalizeSpotifyUrl(input) {
  if (!input) return null;
  const trimmed = input.trim();
  // spotify:playlist:XXXX → web URL
  const uriMatch = trimmed.match(/^spotify:playlist:([a-zA-Z0-9]+)/);
  if (uriMatch) return `https://open.spotify.com/playlist/${uriMatch[1]}`;
  // open.spotify.com/playlist/XXXX (with optional query)
  const urlMatch = trimmed.match(/open\.spotify\.com\/playlist\/([a-zA-Z0-9]+)/);
  if (urlMatch) return `https://open.spotify.com/playlist/${urlMatch[1]}`;
  // Album/track URLs work too
  const otherMatch = trimmed.match(/open\.spotify\.com\/(album|track|artist|show|episode)\/([a-zA-Z0-9]+)/);
  if (otherMatch) return `https://open.spotify.com/${otherMatch[1]}/${otherMatch[2]}`;
  const otherUri = trimmed.match(/^spotify:(album|track|artist|show|episode):([a-zA-Z0-9]+)/);
  if (otherUri) return `https://open.spotify.com/${otherUri[1]}/${otherUri[2]}`;
  return null;
}

function launchSpotify(url) {
  if (!url) return false;
  try {
    window.open(url, '_blank', 'noopener,noreferrer');
    return true;
  } catch (e) {
    console.warn('Could not launch Spotify:', e);
    return false;
  }
}

// Build flat lookup of items with computed metadata — now across ALL courses.
// Item IDs are globally unique because each course has its own prefix.
// The legacy `dva.sN.M` IDs are preserved exactly, so existing stored
// `courseCompleted` entries and session `courseItemId` links keep working.
const COURSE_ITEMS = (() => {
  const items = [];
  for (const course of Object.values(COURSES)) {
    for (const sec of course.sections) {
      sec.items.forEach((rawLabel, idx) => {
        let type = 'video';
        let label = rawLabel;
        if (rawLabel.startsWith('@quiz:')) { type = 'quiz'; label = rawLabel.slice(6); }
        else if (rawLabel.startsWith('@test:')) { type = 'test'; label = rawLabel.slice(6); }
        const id = `${course.idPrefix}.s${sec.n}.${idx + 1}`;
        items.push({
          id,
          courseId: course.id,
          sectionN: sec.n,
          sectionTitle: sec.title,
          cats: sec.cats,
          label,
          type,
        });
      });
    }
  }
  return items;
})();

const COURSE_ITEM_BY_ID = Object.fromEntries(COURSE_ITEMS.map(i => [i.id, i]));

// Course-scoped helpers. Prefer these over the global totals below.
function getCourse(courseId) { return COURSES[courseId] || null; }
function getCourseItems(courseId) { return COURSE_ITEMS.filter(i => i.courseId === courseId); }
function getCourseTotalAll(courseId) { return getCourseItems(courseId).length; }
function getCourseTotalVideos(courseId) { return getCourseItems(courseId).filter(i => i.type === 'video').length; }
function listCourses() {
  // Preserve insertion order of COURSES declaration
  return Object.values(COURSES);
}

    autoBackupMode: 'once-per-day',

    },

  sessions: [],
  cycleCount: 0, // focus sessions completed in current cycle (resets after long break)
  draft: { topic: '', categories: [], resourceType: 'video', resourceTitle: '', resourceUrl: '', courseItemId: null },
  courseCompleted: [], // array of course item IDs marked as done
  reviewState: {}, // { [sessionId]: { interval, nextDue, reviewCount, history, retired } }
  flashcardState: {}, // { [cardId]: { interval, nextDue, reviewCount, history, retired, firstSeenAt } }
  // Per-question scenario quiz state. Same shape as flashcardState (SR-driven).

// ============================================================================
// SPACED REPETITION
// SuperMemo-inspired intervals (days). Forgot resets to 1, Hazy holds, Solid doubles.
// Initial interval is seeded from session confidence; open questions always start at 1.
// ============================================================================

const SR_MAX_INTERVAL = 180;

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}

function isReviewable(session) {
  if (!session.recall) return false;
  const hasContent = (session.recall.learned || '').trim().length >= 10;
  return hasContent;
}

function initialReviewItem(session) {
  const conf = session.recall?.confidence || 3;
  const hasQuestions = (session.recall?.questions || '').trim().length > 0;
  // confidence-driven seed; open questions always come back fast
  const seed = hasQuestions ? 1 : [1, 1, 2, 4, 7, 14][conf];
  // Anchor to when the session actually happened — not "now" — so backfilled
  // historical sessions land in the queue at the correct moment.
  const anchorDay = startOfDay(new Date(session.startedAt || Date.now()));
  return {
    interval: seed,
    nextDue: addDays(anchorDay, seed).toISOString(),
    reviewCount: 0,
    history: [],
    retired: false,
  };
}

function gradeReviewItem(item, grade) {
  // grade: 'forgot' | 'hazy' | 'solid'
  let newInterval;
  switch (grade) {
    case 'forgot': newInterval = 1; break;
    case 'hazy':   newInterval = Math.max(1, item.interval); break;
    case 'solid':  newInterval = Math.min(Math.max(2, item.interval * 2), SR_MAX_INTERVAL); break;
    default:       newInterval = item.interval;
  }
  const today = startOfDay(new Date());
  return {
    ...item,
    interval: newInterval,
    nextDue: addDays(today, newInterval).toISOString(),
    reviewCount: (item.reviewCount || 0) + 1,
    history: [...(item.history || []), { date: new Date().toISOString(), grade, intervalAfter: newInterval }],
  };
}

function getDueReviews(sessions, reviewState) {
  const todayMs = startOfDay(new Date()).getTime();
  const due = [];
  for (const s of sessions) {
    if (!isReviewable(s)) continue;
    const item = reviewState[s.id];
    if (!item || item.retired) continue;
    if (new Date(item.nextDue).getTime() <= todayMs) {
      due.push({ session: s, item });
    }
  }
  // Most overdue first
  due.sort((a, b) => new Date(a.item.nextDue) - new Date(b.item.nextDue));
  return due;
}

function getUpcomingReviews(sessions, reviewState, withinDays = 7) {
  const todayMs = startOfDay(new Date()).getTime();
  const limitMs = todayMs + withinDays * 24 * 60 * 60 * 1000;
  const upcoming = [];
  for (const s of sessions) {
    if (!isReviewable(s)) continue;
    const item = reviewState[s.id];
    if (!item || item.retired) continue;
    const dueMs = new Date(item.nextDue).getTime();
    if (dueMs > todayMs && dueMs <= limitMs) {
      upcoming.push({ session: s, item });
    }
  }
  upcoming.sort((a, b) => new Date(a.item.nextDue) - new Date(b.item.nextDue));
  return upcoming;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      // First-ever load: honor system preference for theme
      const prefersLight = typeof window !== 'undefined'
        && window.matchMedia
        && window.matchMedia('(prefers-color-scheme: light)').matches;
      return {
        ...defaultState,
        settings: {
          ...defaultState.settings,
          theme: prefersLight ? 'light' : 'dark',
        },
      };
    }
    const parsed = JSON.parse(raw);
    return { ...defaultState, ...parsed,
      settings: { ...defaultState.settings, ...(parsed.settings || {}),
        music: { ...defaultState.settings.music, ...((parsed.settings && parsed.settings.music) || {}) },
      },
      draft: { ...defaultState.draft, ...(parsed.draft || {}) },
      sessions: Array.isArray(parsed.sessions) ? parsed.sessions : [],
      courseCompleted: Array.isArray(parsed.courseCompleted) ? parsed.courseCompleted : [],
      reviewState: (parsed.reviewState && typeof parsed.reviewState === 'object') ? parsed.reviewState : {},
      flashcardState: (parsed.flashcardState && typeof parsed.flashcardState === 'object') ? parsed.flashcardState : {},
      quizBankState: (parsed.quizBankState && typeof parsed.quizBankState === 'object') ? parsed.quizBankState : {},
      streak: {
        ...defaultState.streak,
        ...(parsed.streak && typeof parsed.streak === 'object' ? parsed.streak : {}),
      },
    };
  } catch (e) {
    console.warn('Could not load state:', e);
    return defaultState;
  }
}

// Migration: seed reviewState entries for any sessions that have recall but no review item yet.
// Runs once on mount via useEffect.
function backfillReviewState(state) {
  let changed = false;
  const next = { ...state.reviewState };
  for (const s of state.sessions) {
    if (isReviewable(s) && !next[s.id]) {
      next[s.id] = initialReviewItem(s);
      changed = true;
    }
  }
  return changed ? next : state.reviewState;
}

function saveState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.warn('Could not save state:', e);
  }
}

// ============================================================================
// BACKUP MANAGER — auto-save your study history after every session.
// Three layers, any combo can be enabled in Settings:
//   1. LocalStorage ring: 7 daily snapshots under `refocus.snapshots`. Free, instant.
//   2. File System Access (Chrome/Edge only): silent write to a folder you pick once.
//      Writes `Productivity App Backup.json` (rolling latest) every save, plus
//      `Productivity App Backup - YYYY-MM-DD.json` once per calendar day.
//   3. Weekly download fallback: triggers a .json download once per week if FSA isn't available.
// ============================================================================

const BACKUP_SNAPSHOTS_KEY = 'refocus.snapshots';
const BACKUP_FSA_HANDLE_KEY = 'refocus.fsaHandle';
const BACKUP_LAST_DOWNLOAD_KEY = 'refocus.lastDownloadAt';
const BACKUP_MAX_SNAPSHOTS = 7;
const BACKUP_FILENAME_LATEST = 'Productivity App Backup.json';
const BACKUP_WEEKLY_MS = 7 * 24 * 60 * 60 * 1000;

// IndexedDB helpers to store the FileSystemDirectoryHandle across page loads.
// FSA handles aren't serializable to localStorage — must use IDB.
function idbGetHandle() {
  return new Promise((resolve) => {
    try {
      const req = indexedDB.open('refocus-backup', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('handles');
      req.onsuccess = () => {
        const tx = req.result.transaction('handles', 'readonly');
        const store = tx.objectStore('handles');
        const getReq = store.get(BACKUP_FSA_HANDLE_KEY);
        getReq.onsuccess = () => resolve(getReq.result || null);
        getReq.onerror = () => resolve(null);
      };
      req.onerror = () => resolve(null);
    } catch { resolve(null); }
  });
}
function idbSetHandle(handle) {
  return new Promise((resolve) => {
    try {
      const req = indexedDB.open('refocus-backup', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('handles');
      req.onsuccess = () => {
        const tx = req.result.transaction('handles', 'readwrite');
        const store = tx.objectStore('handles');
        store.put(handle, BACKUP_FSA_HANDLE_KEY);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      };
      req.onerror = () => resolve(false);
    } catch { resolve(false); }
  });
}
function idbClearHandle() {
  return new Promise((resolve) => {
    try {
      const req = indexedDB.open('refocus-backup', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('handles');
      req.onsuccess = () => {
        const tx = req.result.transaction('handles', 'readwrite');
        tx.objectStore('handles').delete(BACKUP_FSA_HANDLE_KEY);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      };
      req.onerror = () => resolve(false);
    } catch { resolve(false); }
  });
}

// True if the File System Access API for directory handles is available AND
// we're not in a `file://` context (where it's blocked for security).
function isFsaSupported() {
  return typeof window !== 'undefined'
    && typeof window.showDirectoryPicker === 'function'
    && window.location.protocol !== 'file:';
}

async function fsaPickDirectory() {
  if (!isFsaSupported()) return { ok: false, reason: 'unsupported' };
  try {
    const handle = await window.showDirectoryPicker({
      mode: 'readwrite',
      startIn: 'documents',
      id: 'refocus-productivity-backups',
    });
    await idbSetHandle(handle);
    return { ok: true, handle };
  } catch (e) {
    return { ok: false, reason: e?.name === 'AbortError' ? 'cancelled' : String(e) };
  }
}

async function fsaEnsurePermission(handle) {
  if (!handle) return false;
  try {
    const opts = { mode: 'readwrite' };
    if ((await handle.queryPermission(opts)) === 'granted') return true;
    return (await handle.requestPermission(opts)) === 'granted';
  } catch { return false; }
}

async function fsaWriteFile(handle, filename, contents) {
  const fileHandle = await handle.getFileHandle(filename, { create: true });
  const writable = await fileHandle.createWritable();
  await writable.write(contents);
  await writable.close();
}

// Local ring of the last 7 daily snapshots in localStorage (tiny, resilient, free).
function writeSnapshotRing(state) {
  try {
    const todayKey = dayKey(new Date().toISOString());
    const raw = localStorage.getItem(BACKUP_SNAPSHOTS_KEY);
    let ring = raw ? JSON.parse(raw) : [];
    // Replace today's snapshot or prepend
    ring = ring.filter(s => s.day !== todayKey);
    ring.unshift({
      day: todayKey,
      at: new Date().toISOString(),
      state,
    });
    // Cap size
    ring = ring.slice(0, BACKUP_MAX_SNAPSHOTS);
    localStorage.setItem(BACKUP_SNAPSHOTS_KEY, JSON.stringify(ring));
    return true;
  } catch (e) {
    console.warn('Snapshot ring failed:', e);
    return false;
  }
}

function readSnapshotRing() {
  try {
    const raw = localStorage.getItem(BACKUP_SNAPSHOTS_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}

// Trigger a download of the current state as a .json — used as a weekly fallback
// OR as a manual "Export now" action. Filename: "Productivity App Backup - YYYY-MM-DD.json"
function downloadBackup(state, tag) {
  try {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const datePart = dayKey(new Date().toISOString());
    a.download = tag
      ? `Productivity App Backup - ${tag} - ${datePart}.json`
      : `Productivity App Backup - ${datePart}.json`;
    a.click();
    URL.revokeObjectURL(url);
    localStorage.setItem(BACKUP_LAST_DOWNLOAD_KEY, String(Date.now()));
    return true;
  } catch (e) {
    console.warn('Download backup failed:', e);
    return false;
  }
}

function needsWeeklyDownload() {
  try {
    const raw = localStorage.getItem(BACKUP_LAST_DOWNLOAD_KEY);
    if (!raw) return true;
    return Date.now() - Number(raw) > BACKUP_WEEKLY_MS;
  } catch { return false; }
}

// Orchestrator: runs all enabled layers after a session completes.
// Called from session-save paths. `options.mode` controls cadence:
//   'always'   — download on every save (safest, one file per session)
//   'once-per-day' — download once per calendar day (less spam)
//   'weekly'   — download only if last download was > 7 days ago
//   'off'      — skip downloads (still writes localStorage snapshot ring)
async function runAutoBackup(state, options = {}) {
  const results = [];
  const mode = options.mode || 'once-per-day';

  // Layer 1: ALWAYS write the local snapshot ring — free, instant, resilient
  if (writeSnapshotRing(state)) results.push('snapshot');

  // Layer 2: if FSA is active and we have a handle, write silently (Chrome/Edge, non-file://)
  if (options.fsaEnabled && isFsaSupported()) {
    try {
      const handle = await idbGetHandle();
      if (handle && (await fsaEnsurePermission(handle))) {
        const json = JSON.stringify(state, null, 2);
        await fsaWriteFile(handle, BACKUP_FILENAME_LATEST, json);
        const todayName = `Productivity App Backup - ${dayKey(new Date().toISOString())}.json`;
        await fsaWriteFile(handle, todayName, json);
        results.push('folder');
      }
    } catch (e) {
      console.warn('FSA backup failed:', e);
    }
  }

  // Layer 3: triggered download based on cadence. Only if we didn't already write via FSA.
  if (!results.includes('folder') && mode !== 'off') {
    let shouldDownload = false;
    if (mode === 'always') {
      shouldDownload = true;
    } else if (mode === 'once-per-day') {
      // Download if the last download wasn't today
      const raw = localStorage.getItem(BACKUP_LAST_DOWNLOAD_KEY);
      if (!raw) {
        shouldDownload = true;
      } else {
        const lastDay = dayKey(new Date(Number(raw)).toISOString());
        if (lastDay !== dayKey(new Date().toISOString())) shouldDownload = true;
      }
    } else if (mode === 'weekly') {
      shouldDownload = needsWeeklyDownload();
    }
    if (shouldDownload) {
      if (downloadBackup(state)) results.push('download');
    }
  }

  return results;
}

// ============================================================================
// AUDIO — Web Audio generated tones
// ============================================================================

class AudioEngine {
  constructor() {
    this.ctx = null;
    this.volume = 0.5;
  }
  ensureCtx() {
    if (!this.ctx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) this.ctx = new Ctx();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  }
  playTone({ freq, duration = 0.3, type = 'sine', delay = 0, gain = 0.3 }) {
    const ctx = this.ensureCtx();
    if (!ctx) return;
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain * this.volume, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(g).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.05);
  }
  // Distinctive cues for each transition
  focusStart() {
    // Ascending two-note chime — bright, motivating
    this.playTone({ freq: 523.25, duration: 0.25, type: 'sine', delay: 0,    gain: 0.3 }); // C5
    this.playTone({ freq: 783.99, duration: 0.45, type: 'sine', delay: 0.18, gain: 0.3 }); // G5
  }
  focusEnd() {
    // Three-tone chime — completion bell
    this.playTone({ freq: 880.00, duration: 0.3,  type: 'triangle', delay: 0,    gain: 0.28 }); // A5
    this.playTone({ freq: 659.25, duration: 0.35, type: 'triangle', delay: 0.22, gain: 0.28 }); // E5
    this.playTone({ freq: 523.25, duration: 0.7,  type: 'triangle', delay: 0.45, gain: 0.28 }); // C5
  }
  breakStart() {
    // Soft single tone — settle
    this.playTone({ freq: 440.00, duration: 0.6, type: 'sine', delay: 0, gain: 0.22 }); // A4
  }
  breakEnd() {
    // Gentle double tap — back to work
    this.playTone({ freq: 587.33, duration: 0.18, type: 'sine', delay: 0,    gain: 0.25 }); // D5
    this.playTone({ freq: 587.33, duration: 0.18, type: 'sine', delay: 0.22, gain: 0.25 });
  }
  test() {
    this.playTone({ freq: 660, duration: 0.15, type: 'sine', delay: 0, gain: 0.25 });
  }
}

const audio = new AudioEngine();

// ============================================================================
// UTILITIES
// ============================================================================

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

function fmtSecs(s) {
  if (s < 0) s = 0;
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
}

function fmtMinutes(totalSec) {
  const m = Math.round(totalSec / 60);
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  const rm = m % 60;
  return rm ? `${h}h ${rm}m` : `${h}h`;
}

function isToday(iso) {
  const d = new Date(iso);
  const now = new Date();
  return d.toDateString() === now.toDateString();
}

function daysBetween(iso, now = Date.now()) {
  const ms = now - new Date(iso).getTime();
  return Math.floor(ms / (1000 * 60 * 60 * 24));
}

function startOfDay(d) {
  const x = new Date(d);
  x.setHours(0,0,0,0);
  return x;
}

function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function dayKey(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getCategory(id) { return AWS_CATEGORIES.find(c => c.id === id); }

// ── STREAK HELPERS ──────────────────────────────────────────────────────────
// Milestone tiers drive the celebration copy + flame color.
function getStreakMilestone(days) {
  if (days >= 365) return { tier: 'mythic',    title: 'A FULL YEAR',           sub: "You're built different. 365 days of showing up." };
  if (days >= 200) return { tier: 'legendary', title: '200 days',              sub: 'Legend tier. Most people never make it here.' };
  if (days >= 100) return { tier: 'century',   title: 'Century club',          sub: '100 days. Triple digits. No one can take this from you.' };
  if (days >= 50)  return { tier: 'half-ton',  title: '50 days strong',        sub: 'Halfway to the century mark.' };
  if (days >= 30)  return { tier: 'month',     title: 'One full month',        sub: '30 days of consistency. This is a habit now.' };
  if (days >= 14)  return { tier: 'fortnight', title: 'Two weeks in',          sub: 'Momentum is real. Keep the flame.' };
  if (days >= 7)   return { tier: 'week',      title: 'One week strong',       sub: 'A full week. This is how streaks become identity.' };
  if (days >= 3)   return { tier: 'spark',     title: 'Getting real',          sub: `Day ${days}. The hardest part is behind you.` };
  if (days >= 2)   return { tier: 'spark',     title: 'Two days in a row',     sub: 'Back-to-back. Keep it going.' };
  return             { tier: 'kindle',    title: 'First day done',        sub: 'Every streak starts with one.' };
}

// Streak-at-risk: goal not yet met AND it's after 6pm local time
function isStreakAtRisk(stats) {
  if (stats.goalMetToday) return false;
  if (stats.streakDays === 0) return false; // no streak to lose
  return new Date().getHours() >= 18;
}

// Flame color by streak tier — for the persistent header chip
function getFlameColorClass(days) {
  if (days >= 365) return 'text-fuchsia-400';
  if (days >= 100) return 'text-violet-400';
  if (days >= 30)  return 'text-amber-300';
  if (days >= 7)   return 'text-ember-400';
  if (days >= 1)   return 'text-ember-500';
  return 'text-ink-600';
}

function App() {
  const [state, setState] = useState(loadState);
  const [phase, setPhase] = useState(PHASE.IDLE);
  const [running, setRunning] = useState(false);
  const [secondsLeft, setSecondsLeft] = useState(state.settings.focusMinutes * 60);
  const [phaseStartedAt, setPhaseStartedAt] = useState(null);
  const [pendingRecall, setPendingRecall] = useState(null); // session object awaiting recall
  const [view, setView] = useState('focus'); // 'focus' | 'log' | 'coverage' | 'settings'
  // Phase 3: when the Focus-view weak-spot chip is clicked, we set this to
  // { mode: 'scenarios', source: 'weak' } so FlashcardsView can read it on
  // mount and jump straight into weak-spots mode. Consumed immediately.
  const [pendingFlashcardsIntent, setPendingFlashcardsIntent] = useState(null);
  const [toast, setToast] = useState(null);
  const wasSkippedRef = useRef(false);
  const [reviewSession, setReviewSession] = useState(null); // { items: [...], index: 0 } when reviewing
  const didBackfillRef = useRef(false);

  // Backfill review state for legacy sessions (recall present but no SR entry yet)
  useEffect(() => {
    if (didBackfillRef.current) return;
    didBackfillRef.current = true;
    const next = backfillReviewState(state);
    if (next !== state.reviewState) {
      setState(s => ({ ...s, reviewState: next }));
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Persist state
  useEffect(() => { saveState(state); }, [state]);

  // ── THEME ─────────────────────────────────────────────────────────────
  // Toggles the `theme-light` class on <html>. Defaults to dark; respects
  // prefers-color-scheme on first ever load if no preference is saved yet.
  useEffect(() => {
    const theme = state.settings?.theme || 'dark';
    const root = document.documentElement;
    if (theme === 'light') root.classList.add('theme-light');
    else root.classList.remove('theme-light');
  }, [state.settings?.theme]);

  function toggleTheme() {
    setState(s => ({
      ...s,
      settings: {
        ...s.settings,
        theme: (s.settings?.theme === 'light') ? 'dark' : 'light',
      },
    }));
  }

  // ── STREAK CELEBRATION ──────────────────────────────────────────────────
  // Fires once per day when the daily goal is first met.
  // (The effect that consumes `stats` is defined after `stats` is computed below.)
  const [celebration, setCelebration] = useState(null); // { streakDays, isNewRecord, milestone }

  // Audio volume sync
  useEffect(() => { audio.volume = state.settings.audioEnabled ? state.settings.audioVolume : 0; }, [state.settings.audioEnabled, state.settings.audioVolume]);

  // Update document title with timer
  useEffect(() => {
    if (running && phase !== PHASE.IDLE) {
      const phaseLabel = phase === PHASE.FOCUS ? 'Focus' : 'Break';
      document.title = `${fmtSecs(secondsLeft)} · ${phaseLabel} — re:Focus`;
    } else {
      document.title = 're:Focus — AWS SA Study Companion';
    }
  }, [running, phase, secondsLeft]);

  // Ref to always-fresh handlePhaseComplete so the interval closure doesn't go stale
  // when the user edits the draft mid-session.
  const handlePhaseCompleteRef = useRef(() => {});

  // Timer tick
  useEffect(() => {
    if (!running) return;
    const interval = setInterval(() => {
      setSecondsLeft(s => {
        if (s <= 1) {
          // Defer to next tick so React state updates settle cleanly
          setTimeout(() => handlePhaseCompleteRef.current(), 0);
          return 0;
        }
        return s - 1;
      });
    }, 1000);
    return () => clearInterval(interval);
  }, [running]);

  function showToast(msg, kind = 'info') {
    setToast({ msg, kind, id: uid() });
    setTimeout(() => setToast(null), 3500);
  }

  function notify(title, body) {
    if (!state.settings.notificationsEnabled) return;
    if (typeof Notification === 'undefined') return;
    if (Notification.permission === 'granted') {
      try { new Notification(title, { body, silent: true }); } catch (e) {}
    }
  }

  function phaseDuration(p) {
    switch (p) {
      case PHASE.FOCUS: return state.settings.focusMinutes * 60;
      case PHASE.SHORT: return state.settings.shortBreakMinutes * 60;
      case PHASE.LONG:  return state.settings.longBreakMinutes * 60;
      default: return state.settings.focusMinutes * 60;
    }
  }

  function startPhase(p) {
    setPhase(p);
    setSecondsLeft(phaseDuration(p));
    setPhaseStartedAt(new Date().toISOString());
    setRunning(true);

    if (p === PHASE.FOCUS) {
      audio.focusStart();
      notify('Focus session started', state.draft.topic ? `Working on: ${state.draft.topic}` : 'Get into it.');
    } else {
      audio.breakStart();
      notify(p === PHASE.LONG ? 'Long break started' : 'Short break started', 'Step away from the screen.');
    }
  }

  function handlePhaseComplete() {
    const completedPhase = phase;
    const startedAt = phaseStartedAt;
    const configuredDuration = phaseDuration(completedPhase);
    const wasSkipped = wasSkippedRef.current;
    wasSkippedRef.current = false;
    // Actual elapsed — handles "skip" correctly
    const actualDuration = startedAt
      ? Math.max(1, Math.floor((Date.now() - new Date(startedAt).getTime()) / 1000))
      : configuredDuration;

    if (completedPhase === PHASE.FOCUS) {
      // Only celebrate (and notify) on natural completion, not manual skip
      if (!wasSkipped) {
        audio.focusEnd();
        notify('Focus complete', 'Time to capture what you learned.');
      }
      // Don't save fragments — under 30s on a skip means it's noise, not a session
      const worthSaving = actualDuration >= 30 && !(wasSkipped && actualDuration < 60);
      // Best-effort topic: if the user didn't type one but linked a course item,
      // use its label; if they set a resource title, use that. Only fall back to
      // empty string if all three are missing — that case shows "(untitled)" in
      // the UI, now rare rather than the default.
      const linkedCourseItem = state.draft.courseItemId
        ? COURSE_ITEM_BY_ID[state.draft.courseItemId]
        : null;
      const topicForSession =
           (state.draft.topic || '').trim()
        || (linkedCourseItem && linkedCourseItem.label)
        || (state.draft.resourceTitle || '').trim()
        || '';
      const sessionDraft = {
        id: uid(),
        startedAt: startedAt || new Date(Date.now() - configuredDuration * 1000).toISOString(),
        endedAt: new Date().toISOString(),
        durationSeconds: actualDuration,
        configuredDurationSeconds: configuredDuration,
        type: 'focus',
        completed: actualDuration >= configuredDuration * 0.9,
        skipped: wasSkipped,
        topic: topicForSession,
        categories: [...state.draft.categories],
        resource: {
          type: state.draft.resourceType,
          title: state.draft.resourceTitle,
          url: state.draft.resourceUrl,
        },
        courseItemId: state.draft.courseItemId || null,
        recall: null,
      };
      // Only prompt for recall on real completions (or long skips); always need 60s+ to be worth recalling
      if (worthSaving && actualDuration >= 60 && !wasSkipped) {
        setPendingRecall(sessionDraft);
      } else if (worthSaving) {
        setState(s => ({ ...s, sessions: [{ ...sessionDraft, recall: null }, ...s.sessions] }));
      }
      // Determine next phase. Increment cycleCount; reset to 0 only AFTER long break ends.
      const newCount = state.cycleCount + 1;
      const nextPhase = newCount >= state.settings.longBreakInterval ? PHASE.LONG : PHASE.SHORT;
      // Don't advance the cycle on a skip — you didn't earn it
      if (!wasSkipped) {
        setState(s => ({ ...s, cycleCount: newCount }));
      }
      setRunning(false);
      setSecondsLeft(phaseDuration(wasSkipped ? PHASE.FOCUS : nextPhase));
      setPhase(wasSkipped ? PHASE.IDLE : nextPhase);
      if (!wasSkipped && state.settings.autostartBreaks) {
        setPhaseStartedAt(new Date().toISOString());
        setRunning(true);
      }
    } else {
      // Break complete
      if (!wasSkipped) {
        audio.breakEnd();
        notify('Break over', 'Ready for the next focus block?');
      }
      if (completedPhase === PHASE.LONG) {
        setState(s => ({ ...s, cycleCount: 0 }));
      }
      setPhase(PHASE.IDLE);
      setRunning(false);
      setSecondsLeft(state.settings.focusMinutes * 60);
      if (!wasSkipped && state.settings.autostartFocus) {
        startPhase(PHASE.FOCUS);
      }
    }
  }

  // Keep the ref pointing at the latest closure on every render
  handlePhaseCompleteRef.current = handlePhaseComplete;

  // Keyboard shortcuts — global, but ignored when typing inside form fields
  const [showShortcuts, setShowShortcuts] = useState(false);
  useEffect(() => {
    function inField(el) {
      if (!el) return false;
      const tag = el.tagName;
      return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
    }
    function onKey(e) {
      if (pendingRecall) return; // recall modal owns the keyboard
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (inField(document.activeElement)) {
        // Allow Esc to leave a field
        if (e.key === 'Escape') document.activeElement.blur();
        return;
      }
      if (e.key === ' ' || e.code === 'Space') {
        if (phase !== PHASE.IDLE) {
          e.preventDefault();
          pauseResume();
        } else if (view === 'focus') {
          e.preventDefault();
          handleManualStartFocus();
        }
      } else if (e.key.toLowerCase() === 's') {
        if (phase !== PHASE.IDLE) {
          e.preventDefault();
          skipPhase();
        }
      } else if (e.key.toLowerCase() === 'r') {
        if (phase !== PHASE.IDLE) {
          e.preventDefault();
          reset();
        } else {
          // R during idle = start review if anything is due
          const due = getDueReviews(state.sessions, state.reviewState);
          if (due.length > 0) {
            e.preventDefault();
            setReviewSession({ items: due, index: 0, graded: [] });
          }
        }
      } else if (e.key === '/') {
        e.preventDefault();
        setView('course');
        setTimeout(() => {
          const input = document.querySelector('input[placeholder^="Search course"]');
          input?.focus();
        }, 50);
      } else if (e.key === '?') {
        e.preventDefault();
        setShowShortcuts(s => !s);
      } else if (e.key === 'Escape') {
        if (showShortcuts) setShowShortcuts(false);
      }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [phase, view, pendingRecall, showShortcuts, state.draft.courseItemId, state.settings.music.enabled]);

  function pauseResume() {
    audio.ensureCtx(); // unlock audio on user gesture
    setRunning(r => !r);
  }

  function reset() {
    setRunning(false);
    setPhase(PHASE.IDLE);
    setSecondsLeft(state.settings.focusMinutes * 60);
    setPhaseStartedAt(null);
  }

  function skipPhase() {
    if (phase === PHASE.IDLE) return;
    wasSkippedRef.current = true;
    setSecondsLeft(0);
    handlePhaseComplete();
  }

  function saveRecall(recall, markCourseCompleteId) {
    if (!pendingRecall) return;
    const session = { ...pendingRecall, recall };
    let newReviewItem = null;
    setState(s => {
      const next = { ...s, sessions: [session, ...s.sessions] };
      // Seed SR entry if the recall is substantive enough to be reviewable
      if (isReviewable(session)) {
        newReviewItem = initialReviewItem(session);
        next.reviewState = { ...s.reviewState, [session.id]: newReviewItem };
      }
      if (markCourseCompleteId && !s.courseCompleted.includes(markCourseCompleteId)) {
        next.courseCompleted = [...s.courseCompleted, markCourseCompleteId];
        next.draft = { ...s.draft, courseItemId: null };
      }
      return next;
    });
    setPendingRecall(null);

    // Build toast message: combine course-complete + next-review info when relevant
    const parts = [];
    if (markCourseCompleteId) {
      const item = COURSE_ITEM_BY_ID[markCourseCompleteId];
      parts.push(`${item?.label || 'Item'} marked complete`);
    } else {
      parts.push('Session logged');
    }
    if (newReviewItem) {
      const due = new Date(newReviewItem.nextDue);
      const todayMs = startOfDay(new Date()).getTime();
      const dueMs = startOfDay(due).getTime();
      const days = Math.round((dueMs - todayMs) / (1000 * 60 * 60 * 24));
      const dateLabel = due.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
      const relLabel = days <= 0 ? 'today' : days === 1 ? 'tomorrow' : `in ${days} days`;
      parts.push(`review ${relLabel} · ${dateLabel}`);
    }
    showToast(parts.join(' \u00b7 '));
  }

  function skipRecall() {
    if (!pendingRecall) return;
    const session = { ...pendingRecall, recall: null };
    setState(s => ({ ...s, sessions: [session, ...s.sessions] }));
    setPendingRecall(null);
  }

  function setSettings(patch) {
    setState(s => ({ ...s, settings: { ...s.settings, ...patch } }));
  }

  function setMusic(patch) {
    setState(s => ({ ...s, settings: { ...s.settings, music: { ...s.settings.music, ...patch } } }));
  }

  function getSelectedPlaylist() {
    const id = state.settings.music.selectedPlaylistId;
    return BUILTIN_PLAYLISTS.find(p => p.id === id)
        || state.settings.music.customPlaylists.find(p => p.id === id)
        || null;
  }

  function handleManualStartFocus() {
    // Manual user-initiated start — safe to open Spotify here (within user-activation gesture)
    if (state.settings.music.enabled) {
      const pl = getSelectedPlaylist();
      if (pl?.url) launchSpotify(pl.url);
    }
    startPhase(PHASE.FOCUS);
  }

  function handlePlayMusic() {
    const pl = getSelectedPlaylist();
    if (pl?.url) {
      launchSpotify(pl.url);
      showToast(`Opening ${pl.name} in Spotify\u2026`);
    } else {
      showToast('No playlist selected.');
    }
  }

  function pickCourseItem(itemId) {
    const item = COURSE_ITEM_BY_ID[itemId];
    if (!item) return;
    const course = getCourse(item.courseId);
    const courseCode = course?.info?.code || COURSE_INFO.code;
    setState(s => ({
      ...s,
      draft: {
        ...s.draft,
        topic: item.label,
        categories: [...item.cats],
        resourceType: item.type === 'quiz' ? 'other' : item.type === 'test' ? 'other' : 'video',
        resourceTitle: `${courseCode} · §${item.sectionN}: ${item.label}`,
        resourceUrl: '',
        courseItemId: itemId,
      },
    }));
    setView('focus');
    showToast(`Loaded: ${item.label}`);
  }

  function clearCourseItem() {
    setState(s => ({ ...s, draft: { ...s.draft, courseItemId: null } }));
  }

  function toggleCourseComplete(itemId) {
    setState(s => {
      const has = s.courseCompleted.includes(itemId);
      return { ...s, courseCompleted: has ? s.courseCompleted.filter(id => id !== itemId) : [...s.courseCompleted, itemId] };
    });
  }

  function startReview() {
    const due = getDueReviews(state.sessions, state.reviewState);
    if (due.length === 0) {
      showToast('Nothing due for review.');
      return;
    }
    setReviewSession({ items: due, index: 0, graded: [] });
  }

  function gradeCurrentReview(grade) {
    if (!reviewSession) return;
    const current = reviewSession.items[reviewSession.index];
    const updated = gradeReviewItem(current.item, grade);
    setState(s => ({ ...s, reviewState: { ...s.reviewState, [current.session.id]: updated } }));
    const nextIndex = reviewSession.index + 1;
    setReviewSession(prev => ({
      ...prev,
      index: nextIndex,
      graded: [...prev.graded, { sessionId: current.session.id, grade, intervalAfter: updated.interval }],
    }));
  }

  function retireCurrentReview() {
    if (!reviewSession) return;
    const current = reviewSession.items[reviewSession.index];
    setState(s => ({
      ...s,
      reviewState: {
        ...s.reviewState,
        [current.session.id]: { ...(s.reviewState[current.session.id] || initialReviewItem(current.session)), retired: true },
      },
    }));
    const nextIndex = reviewSession.index + 1;
    setReviewSession(prev => ({
      ...prev,
      index: nextIndex,
      graded: [...prev.graded, { sessionId: current.session.id, grade: 'retired' }],
    }));
  }

  function endReview() {
    setReviewSession(null);
  }

  function reactivateReview(sessionId) {
    const session = state.sessions.find(s => s.id === sessionId);
    if (!session) return;
    const fresh = initialReviewItem(session);
    setState(s => ({ ...s, reviewState: { ...s.reviewState, [sessionId]: fresh } }));
    showToast('Back in the rotation.');
  }

  function setDraft(patch) {
    setState(s => ({ ...s, draft: { ...s.draft, ...patch } }));
  }

  function applyPreset(preset) {
    setSettings({
      presetId: preset.id,
      focusMinutes: preset.focus,
      shortBreakMinutes: preset.short,
      longBreakMinutes: preset.long,
      longBreakInterval: preset.interval,
    });
    if (phase === PHASE.IDLE) setSecondsLeft(preset.focus * 60);
  }

  function exportJSON() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `refocus-backup-${dayKey(new Date().toISOString())}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Backup downloaded.');
  }

  function exportTodayMarkdown() {
    const today = state.sessions.filter(s => isToday(s.startedAt));
    if (!today.length) { showToast("Nothing logged today yet."); return; }
    const lines = [];
    lines.push(`# Study log — ${new Date().toDateString()}`);
    lines.push('');
    const totalSec = today.reduce((a,s) => a + s.durationSeconds, 0);
    lines.push(`**${today.length} sessions · ${fmtMinutes(totalSec)} of focus time**`);
    lines.push('');
    today.slice().reverse().forEach((s, i) => {
      lines.push(`## ${i+1}. ${s.topic || (s.resource && s.resource.title) || '(no topic)'}`);
      lines.push(`*${fmtTime(s.startedAt)} – ${fmtTime(s.endedAt)} · ${Math.round(s.durationSeconds/60)} min*`);
      if (s.categories?.length) {
        lines.push(`**Areas:** ${s.categories.map(c => getCategory(c)?.label || c).join(', ')}`);
      }
      if (s.resource?.title) {
        lines.push(`**Source:** ${RESOURCE_TYPES.find(r=>r.id===s.resource.type)?.label || s.resource.type} — ${s.resource.title}${s.resource.url ? ` (${s.resource.url})` : ''}`);
      }
      if (s.recall) {
        if (s.recall.learned) { lines.push(''); lines.push(`**Learned:**`); lines.push(s.recall.learned); }
        if (s.recall.keyConcepts?.length) { lines.push(''); lines.push(`**Key concepts:** ${s.recall.keyConcepts.join(' · ')}`); }
        if (s.recall.questions) { lines.push(''); lines.push(`**Open questions:**`); lines.push(s.recall.questions); }
        if (s.recall.confidence) { lines.push(''); lines.push(`**Confidence:** ${s.recall.confidence}/5`); }
      }
      lines.push('');
    });
    const md = lines.join('\n');
    const blob = new Blob([md], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `study-log-${dayKey(new Date().toISOString())}.md`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Today\u2019s log exported.');
  }

  function importJSON(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || typeof parsed !== 'object') throw new Error('Invalid file');
        if (!confirm(`Replace current data with imported file?\n\nThis will overwrite ${state.sessions.length} sessions with ${parsed.sessions?.length ?? 0} sessions.`)) return;
        setState({ ...defaultState, ...parsed,
          settings: { ...defaultState.settings, ...(parsed.settings || {}) },
          draft: { ...defaultState.draft, ...(parsed.draft || {}) },
          sessions: Array.isArray(parsed.sessions) ? parsed.sessions : [],
        });
        showToast('Imported successfully.');
      } catch (e) {
        showToast('Could not parse file.', 'error');
      }
    };
    reader.readAsText(file);
  }

  function deleteSession(id) {
    if (!confirm('Delete this session?')) return;
    setState(s => ({ ...s, sessions: s.sessions.filter(x => x.id !== id) }));
  }

  function clearAll() {
    if (!confirm('Delete ALL sessions? This cannot be undone.')) return;
    if (!confirm('Really? All your data will be gone.')) return;
    setState(s => ({ ...s, sessions: [], cycleCount: 0 }));
    showToast('All sessions cleared.');
  }

  function requestNotifications() {
    if (typeof Notification === 'undefined') { showToast('Notifications not supported in this browser.'); return; }
    Notification.requestPermission().then(p => {
      if (p === 'granted') {
        setSettings({ notificationsEnabled: true });
        showToast('Notifications enabled.');
      } else {
        showToast('Notification permission denied.');
      }
    });
  }

  // ── AUTO-BACKUP ───────────────────────────────────────────────────────
  // Watches session count. When a new session is saved, fires a backup
  // per the user's chosen cadence (always / once-per-day / weekly / off).
  // This is the defense-in-depth safety net against browser cache clears
  // nuking localStorage.
  const lastBackedUpCount = React.useRef(state.sessions.length);
  useEffect(() => {
    const currentCount = state.sessions.length;
    if (currentCount > lastBackedUpCount.current) {
      const mode = state.settings?.autoBackupMode || 'once-per-day';
      // Fire and forget — don't block the UI
      runAutoBackup(state, { mode, fsaEnabled: isFsaSupported() })
        .then(results => {
          if (results.includes('download')) {
            showToast('Backup saved to Downloads', 'success');
          }
        })
        .catch(e => console.warn('Auto-backup error:', e));
    }
    lastBackedUpCount.current = currentCount;
  }, [state.sessions.length]);

  // Stats
  const stats = useMemo(() => computeStats(state.sessions, state.flashcardState), [state.sessions, state.flashcardState]);

  // Streak celebration effect — runs when goalMetToday flips true and we haven't celebrated today.
  useEffect(() => {
    if (!stats || !stats.goalMetToday) return;
    const todayKey = dayKey(new Date().toISOString());
    if (state.streak?.lastCelebratedDay === todayKey) return;

    const isNewRecord = stats.streakDays > (state.streak?.bestStreak || 0);
    const milestone = getStreakMilestone(stats.streakDays);

    setCelebration({
      streakDays: stats.streakDays,
      isNewRecord,
      milestone,
    });

    setState(s => ({
      ...s,
      streak: {
        ...(s.streak || {}),
        lastCelebratedDay: todayKey,
        bestStreak: Math.max(s.streak?.bestStreak || 0, stats.streakDays),
      },
    }));
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [stats.goalMetToday, stats.streakDays, state.streak?.lastCelebratedDay]);

  return (
    <div className="min-h-screen flex flex-col">
      <Header view={view} setView={setView} stats={stats} theme={state.settings?.theme || 'dark'} onToggleTheme={toggleTheme} />

      <main className="flex-1 max-w-6xl w-full mx-auto px-6 pb-16">
        {view === 'focus' && (
          <FocusView
            state={state}
            phase={phase}
            running={running}
            secondsLeft={secondsLeft}
            stats={stats}
            onStart={handleManualStartFocus}
            onPauseResume={pauseResume}
            onReset={reset}
            onSkip={skipPhase}
            onDraftChange={setDraft}
            cycleCount={state.cycleCount}
            currentPlaylist={getSelectedPlaylist()}
            musicEnabled={state.settings.music.enabled}
            onToggleMusic={(v) => setMusic({ enabled: v })}
            onPlayMusic={handlePlayMusic}
            onPickCourseItem={() => setView('course')}
            onClearCourseItem={clearCourseItem}
            dueReviews={getDueReviews(state.sessions, state.reviewState)}
            upcomingReviews={getUpcomingReviews(state.sessions, state.reviewState)}
            onStartReview={startReview}
            weakSpotChip={
              (state.settings?.showWeakSpotChip !== false)
                ? getFocusChipData(state.quizBankState || {}, state.settings.selectedCourseId || DEFAULT_COURSE_ID)
                : null
            }
            onJumpToWeakSpots={() => {
              setPendingFlashcardsIntent({ mode: 'scenarios', source: 'weak' });
              setView('flashcards');
            }}
          />
        )}
        {view === 'course' && (
          <CourseView
            sessions={state.sessions}
            courseCompleted={state.courseCompleted}
            currentCourseItemId={state.draft.courseItemId}
            selectedCourseId={state.settings.selectedCourseId || DEFAULT_COURSE_ID}
            onSelectCourse={(id) => setSettings({ selectedCourseId: id })}
            onPickItem={pickCourseItem}
            onToggleComplete={toggleCourseComplete}
          />
        )}
        {view === 'flashcards' && (
          <FlashcardsView
            flashcardState={state.flashcardState || {}}
            setFlashcardState={(updater) => setState(s => ({
              ...s,
              flashcardState: typeof updater === 'function'
                ? updater(s.flashcardState || {})
                : updater
            }))}
            quizBankState={state.quizBankState || {}}
            setQuizBankState={(updater) => setState(s => ({
              ...s,
              quizBankState: typeof updater === 'function'
                ? updater(s.quizBankState || {})
                : updater
            }))}
            selectedCourseId={state.settings.selectedCourseId || DEFAULT_COURSE_ID}
            pendingIntent={pendingFlashcardsIntent}
            onIntentConsumed={() => setPendingFlashcardsIntent(null)}
          />
        )}
        {view === 'log' && (
          <LogView
            sessions={state.sessions}
            onDelete={deleteSession}
            onExportMarkdown={exportTodayMarkdown}
          />
        )}
        {view === 'coverage' && (
          <CoverageView sessions={state.sessions} />
        )}
        {view === 'settings' && (
          <SettingsView
            settings={state.settings}
            setSettings={setSettings}
            setMusic={setMusic}
            applyPreset={applyPreset}
            exportJSON={exportJSON}
            importJSON={importJSON}
            clearAll={clearAll}
            requestNotifications={requestNotifications}
            sessionCount={state.sessions.length}
            onTestMusic={handlePlayMusic}
          />
        )}
      </main>

      {pendingRecall && (
        <RecallModal
          session={pendingRecall}
          courseItem={pendingRecall.courseItemId ? COURSE_ITEM_BY_ID[pendingRecall.courseItemId] : null}
          alreadyComplete={pendingRecall.courseItemId ? state.courseCompleted.includes(pendingRecall.courseItemId) : false}
          onSave={saveRecall}
          onSkip={skipRecall}
        />
      )}

      {showShortcuts && <ShortcutsOverlay onClose={() => setShowShortcuts(false)} />}

      {reviewSession && (
        <ReviewModal
          session={reviewSession}
          onGrade={gradeCurrentReview}
          onRetire={retireCurrentReview}
          onClose={endReview}
        />
      )}

      {toast && <Toast key={toast.id} msg={toast.msg} kind={toast.kind} />}

      {celebration && (
        <StreakCelebration
          streakDays={celebration.streakDays}
          isNewRecord={celebration.isNewRecord}
          milestone={celebration.milestone}
          onClose={() => setCelebration(null)}
        />
      )}

      <Footer />
    </div>
  );
}

function Stat({ label, value, sub }) {
  return (
    <div className="flex flex-col items-end leading-tight">

      <span className="font-mono font-semibold text-ink-50">{value}<span className="text-ink-300 ml-1 font-normal text-[11px]">{sub}</span></span>

// Header streak chip — always visible, animated flame, at-risk pulse after 6pm
function StreakChip({ stats }) {
  const days = stats.streakDays;
  const goalMet = stats.goalMetToday;
  const atRisk = isStreakAtRisk(stats);
  const flameColor = getFlameColorClass(days);

  const tooltip = days === 0
    ? (goalMet ? 'Goal met · streak starts tomorrow if you keep it up' : 'No streak yet · 1 focus session or 5 flashcards to start')
    : atRisk
      ? `${days}-day streak · AT RISK · do 1 session or 5 flashcards before midnight`
      : goalMet
        ? `${days}-day streak · today's goal done ✓`
        : `${days}-day streak · goal not yet met today`;

  return (
    <div
      title={tooltip}
      className={`flex items-center gap-1.5 px-2.5 py-1 rounded-full border transition-all ${
        atRisk
          ? 'bg-rose-500/10 border-rose-500/40 streak-chip-at-risk'
          : goalMet && days > 0
            ? 'bg-ember-500/10 border-ember-500/30'
            : days > 0
              ? 'bg-ink-800/40 border-white/10'
              : 'bg-ink-800/30 border-white/5'
      }`}
    >
      <span
        className={`text-base leading-none ${flameColor} ${goalMet && days > 0 ? 'streak-flame-alive' : ''}`}
        style={{ filter: goalMet && days > 0 ? `drop-shadow(0 0 6px currentColor)` : 'none' }}
      >
        🔥
      </span>
      <div className="flex flex-col leading-tight">
        <span className="small-caps text-ink-400">Streak</span>
        <span className={`font-mono font-semibold ${atRisk ? 'text-rose-200' : 'text-ink-50'}`}>
          {days}<span className="text-ink-300 ml-1 font-normal text-[11px]">{days === 1 ? 'day' : 'days'}</span>
        </span>
      </div>
    </div>
  );
}

// Thin status strip showing today's progress toward the streak-keeping goal.
// Renders only when you have a streak at stake and haven't met the goal yet.
function DailyGoalStrip({ stats }) {
  const atRisk = isStreakAtRisk(stats);
  const fcDone = stats.todayFlashcardsGraded || 0;
  const fcGoal = 5;
  const fcPct = Math.min(100, Math.round((fcDone / fcGoal) * 100));
  const sessionsDone = stats.todaySessions || 0;

  return (
    <div className={`rounded-xl px-4 py-2.5 border flex items-center gap-4 text-xs ${
      atRisk
        ? 'bg-rose-500/10 border-rose-500/30 text-rose-100'
        : 'bg-ink-800/40 border-white/5 text-ink-200'
    }`}>
      <span className={atRisk ? 'text-rose-300' : 'text-ember-400'}>🔥</span>
      <div className="flex-1 flex items-center gap-3 flex-wrap">
        <span className="small-caps tracking-wider">
          {atRisk ? `${stats.streakDays}-day streak at risk` : `keep your ${stats.streakDays}-day streak`}
        </span>
        <span className="text-ink-400">·</span>
        <span>
          <span className={sessionsDone > 0 ? 'text-emerald-300' : 'text-ink-300'}>
            {sessionsDone > 0 ? '✓' : '○'} 1 focus session
          </span>
        </span>
        <span className="text-ink-500 text-[10px]">OR</span>
        <span className="flex items-center gap-1.5">
          <span className={fcDone >= fcGoal ? 'text-emerald-300' : 'text-ink-300'}>
            {fcDone >= fcGoal ? '✓' : '○'} {fcDone}/{fcGoal} flashcards
          </span>
          <span className="w-16 h-1 bg-ink-700 rounded-full overflow-hidden inline-block">
            <span
              className={`h-full block transition-all ${fcDone >= fcGoal ? 'bg-emerald-400' : atRisk ? 'bg-rose-400' : 'bg-ember-500'}`}
              style={{ width: `${fcPct}%` }}
            />
          </span>
        </span>
      </div>
    </div>
  );
}

function FocusView({ state, phase, running, secondsLeft, stats, onStart, onPauseResume, onReset, onSkip, onDraftChange, cycleCount, currentPlaylist, musicEnabled, onToggleMusic, onPlayMusic, onPickCourseItem, onClearCourseItem, dueReviews, upcomingReviews, onStartReview, weakSpotChip, onJumpToWeakSpots }) {
  const totalSec = phase === PHASE.IDLE
    ? state.settings.focusMinutes * 60
    : (phase === PHASE.FOCUS ? state.settings.focusMinutes : phase === PHASE.SHORT ? state.settings.shortBreakMinutes : state.settings.longBreakMinutes) * 60;
  const progress = phase === PHASE.IDLE ? 0 : (totalSec - secondsLeft) / totalSec;

  const isBreak = phase === PHASE.SHORT || phase === PHASE.LONG;
  const accent = isBreak ? '#84a98c' : '#f59e0b';

  const phaseLabel = {
    [PHASE.FOCUS]: 'Focus',
    [PHASE.SHORT]: 'Short Break',
    [PHASE.LONG]:  'Long Break',
    [PHASE.IDLE]:  'Ready',
  }[phase];

  return (
    <div className="space-y-6 mt-10 animate-fade-in">
      {/* Daily goal — tiny status strip under the header */}
      {stats && !stats.goalMetToday && stats.streakDays > 0 && (
        <DailyGoalStrip stats={stats} />
      )}
      {/* Review queue banner — active when items are due */}
      {dueReviews.length > 0 && (
        <ReviewCard dueReviews={dueReviews} upcomingReviews={upcomingReviews} onStart={onStartReview} />
      )}
      {/* Quiet upcoming card — shown only when nothing is due but the rotation is alive */}
      {dueReviews.length === 0 && upcomingReviews.length > 0 && (
        <UpcomingReviewsCard upcomingReviews={upcomingReviews} />
      )}
      {/* Phase 3 — weak-spots chip. Appears only when the mastery engine has
          enough signal AND the user hasn't opted out in Settings. */}
      {weakSpotChip && (
        <button
          onClick={onJumpToWeakSpots}
          className="w-full text-left group rounded-2xl p-4 bg-gradient-to-r from-rose-500/[0.08] via-ember-500/[0.04] to-transparent border border-rose-500/20 hover:border-rose-500/40 transition-all flex items-center gap-4"
          title="Jump into a scenario quiz weighted toward this area"
        >
          <div className="shrink-0 w-9 h-9 rounded-full bg-rose-500/15 border border-rose-500/30 flex items-center justify-center text-base">🎯</div>
          <div className="flex-1 min-w-0">
            <div className="text-[11px] small-caps text-rose-300 mb-0.5">Weakest area</div>
            <div className="text-sm text-ink-100">
              <span className="font-medium">{weakSpotChip.label}</span>
              <span className="font-mono text-rose-300/80 ml-2">{Math.round(weakSpotChip.accuracy * 100)}%</span>
              <span className="text-ink-400 text-xs ml-2">
                last {weakSpotChip.recentCount} attempt{weakSpotChip.recentCount !== 1 ? 's' : ''}
              </span>
            </div>
          </div>
          <span className="shrink-0 text-xs text-ink-300 group-hover:text-ember-300 transition flex items-center gap-1.5">
            Drill it
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
              <line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" />
            </svg>
          </span>
        </button>
      )}

      <div className="grid lg:grid-cols-[1fr_400px] gap-10">
        {/* Timer */}
        <div className="flex flex-col items-center justify-start">
        <div className="small-caps mb-3" style={{ color: accent }}>
          {phaseLabel}
          {phase === PHASE.IDLE && ' to focus'}
        </div>

        <TimerRing
          progress={progress}
          accent={accent}
          isBreak={isBreak}
          running={running}
        >
          <div className="flex flex-col items-center">
            <div className="timer-numerals text-7xl md:text-8xl font-medium text-ink-50 leading-none">
              {fmtSecs(secondsLeft)}
            </div>
            <div className="small-caps text-ink-400 mt-3">
              {phase === PHASE.IDLE ? `${state.settings.focusMinutes}m focus block` : (running ? 'in progress' : 'paused')}
            </div>
          </div>
        </TimerRing>

        {/* Cycle dots */}
        <div className="flex gap-2 mt-8">
          {Array.from({ length: state.settings.longBreakInterval }).map((_, i) => (
            <div
              key={i}
              className="w-2 h-2 rounded-full transition-all duration-300"
              style={{
                background: i < cycleCount ? accent : 'rgba(255,255,255,0.12)',
                boxShadow: i < cycleCount ? `0 0 8px ${accent}66` : 'none',
              }}
            />
          ))}
          <span className="small-caps text-ink-400 ml-3">cycle {cycleCount}/{state.settings.longBreakInterval}</span>
        </div>

        {/* Controls */}
        <div className="flex items-center gap-3 mt-10">
          {phase === PHASE.IDLE ? (
            <button
              onClick={onStart}
              className="px-8 py-3 rounded-full bg-ember-500 hover:bg-ember-400 text-ink-900 font-semibold tracking-wide"
            >Start focus session</button>
          ) : (
            <>
              <button
                onClick={onPauseResume}
                className="px-7 py-3 rounded-full bg-ink-50 hover:bg-white text-ink-900 font-semibold"
              >{running ? 'Pause' : 'Resume'}</button>
              <button
                onClick={onSkip}
                className="px-5 py-3 rounded-full border border-white/15 hover:border-white/30 text-ink-100"
              >Skip</button>
              <button
                onClick={onReset}
                className="px-5 py-3 rounded-full text-ink-300 hover:text-ink-100"
              >Reset</button>
            </>
          )}
        </div>
      </div>

      {/* Session draft */}
      <SessionDraftPanel
        draft={state.draft}
        onChange={onDraftChange}
        disabled={phase === PHASE.IDLE && !running}
        currentPlaylist={currentPlaylist}
        musicEnabled={musicEnabled}
        onToggleMusic={onToggleMusic}
        onPlayMusic={onPlayMusic}
        onPickCourseItem={onPickCourseItem}
        onClearCourseItem={onClearCourseItem}
      />
      </div>
    </div>
  );
}

function TimerRing({ progress, accent, isBreak, running, children }) {
  const size = 360;
  const stroke = 6;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c * (1 - progress);

  return (
    <div
      className={`relative ${running ? (isBreak ? 'ring-glow-break' : 'ring-glow-focus') : ''}`}
      style={{ width: size, height: size }}
    >
      <svg width={size} height={size} className="transform -rotate-90">
        {/* Track */}
        <circle
          cx={size/2} cy={size/2} r={r}
          fill="none"
          stroke="rgba(255,255,255,0.06)"
          strokeWidth={stroke}
        />
        {/* Progress */}
        <circle
          cx={size/2} cy={size/2} r={r}
          fill="none"
          stroke={accent}
          strokeWidth={stroke}
          strokeLinecap="round"
          strokeDasharray={c}
          strokeDashoffset={offset}
          style={{ transition: 'stroke-dashoffset 1s linear, stroke 0.6s ease' }}
        />
        {/* Tick marks every 5 minutes proportionally — simple visual texture */}
        {Array.from({ length: 60 }).map((_, i) => {
          const angle = (i / 60) * 2 * Math.PI;
          const isMajor = i % 5 === 0;
          const x1 = size/2 + (r - 14) * Math.cos(angle);
          const y1 = size/2 + (r - 14) * Math.sin(angle);
          const x2 = size/2 + (r - (isMajor ? 22 : 18)) * Math.cos(angle);
          const y2 = size/2 + (r - (isMajor ? 22 : 18)) * Math.sin(angle);
          return (
            <line
              key={i}
              x1={x1} y1={y1} x2={x2} y2={y2}
              stroke="rgba(255,255,255,0.07)"
              strokeWidth={isMajor ? 1.5 : 1}
            />
          );
        })}
      </svg>
      <div className="absolute inset-0 flex items-center justify-center">
        {children}
      </div>
    </div>
  );
}

function RecallModal({ session, courseItem, alreadyComplete, onSave, onSkip }) {
  const [learned, setLearned] = useState('');
  const [conceptInput, setConceptInput] = useState('');
  const [keyConcepts, setKeyConcepts] = useState([]);
  const [questions, setQuestions] = useState('');

  // Keep latest onSkip in a ref so the mount-only effect below doesn't need
  // to re-run when the parent re-creates the callback. Without this, every
  // re-render stole focus back to the "learned" textarea ~100ms after you
  // tabbed/clicked into Key concepts or Open questions.
  const onSkipRef = useRef(onSkip);
  useEffect(() => { onSkipRef.current = onSkip; }, [onSkip]);

  useEffect(() => {
    const focusTimer = setTimeout(() => learnedRef.current?.focus(), 100);
    // Esc key skips recall
    function onKey(e) {
      if (e.key === 'Escape') onSkipRef.current?.();
    }
    window.addEventListener('keydown', onKey);
    return () => {
      clearTimeout(focusTimer);
      window.removeEventListener('keydown', onKey);
    };
  }, []);

  function addConcept() {
    const v = conceptInput.trim();
    if (!v) return;
    setKeyConcepts(c => [...c, v]);
    setConceptInput('');
  }
  function removeConcept(i) {
    setKeyConcepts(c => c.filter((_,idx) => idx !== i));
  }
  function handleConceptKey(e) {
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      addConcept();
    }
  }

  function save() {
    const recall = {
      learned: learned.trim(),
      keyConcepts,
      questions: questions.trim(),
      confidence,
    };
    onSave(recall, markComplete && courseItem ? courseItem.id : null);
  }

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 backdrop bg-ink-900/70 animate-fade-in">
      <div className="w-full max-w-2xl bg-ink-800 border border-white/10 rounded-2xl shadow-2xl animate-slide-up max-h-[90vh] overflow-y-auto">
        <div className="p-7 space-y-5">
          <div className="flex items-start justify-between gap-4">
            <div className="flex-1 min-w-0">
              <div className="small-caps text-ember-500 mb-1">Active recall</div>
              <h2 className="display-italic text-3xl text-ink-50">What did you learn?</h2>
              {courseItem && (
                <div className="mt-2 inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-ember-500/10 border border-ember-500/30">
                  <span className="text-ember-400 font-mono text-[10px]">§{courseItem.sectionN}</span>
                  <span className="text-ember-200 text-xs">{courseItem.label}</span>
                </div>
              )}
              {session.topic && !courseItem && (
                <div className="text-ink-300 mt-1 text-sm">
                  {Math.round(session.durationSeconds/60)}m on <span className="text-ink-100">{session.topic}</span>
                </div>
              )}
              {courseItem && (
                <div className="text-ink-400 text-xs mt-1">{Math.round(session.durationSeconds/60)} min focus</div>
              )}
            </div>
            <div className="text-[10px] text-ink-400 hidden sm:block">Esc to skip</div>
          </div>

          <div className="space-y-4">
            <Field label="In your own words — what did you learn?">
              <textarea
                ref={learnedRef}
                value={learned}
                onChange={(e) => setLearned(e.target.value)}
                rows={5}
                placeholder={"The key insight, the mental model, the gotcha you didn\u2019t expect\u2026"}
                className="w-full bg-ink-900/60 border border-white/10 focus:border-ember-500/50 rounded-lg px-3 py-2.5 text-ink-50 placeholder-ink-400 outline-none resize-none leading-relaxed"
              />
            </Field>

            <Field label="Key concepts (press Enter to add)">
              <div className="flex flex-wrap gap-1.5 mb-2 min-h-[28px]">
                {keyConcepts.map((c, i) => (
                  <span key={i} className="inline-flex items-center gap-1 bg-ember-500/15 text-ember-300 text-xs px-2 py-1 rounded-full border border-ember-500/30">
                    {c}
                    <button onClick={() => removeConcept(i)} className="text-ember-300 hover:text-ember-200">×</button>
                  </span>
                ))}
              </div>
              <input
                type="text"
                value={conceptInput}
                onChange={(e) => setConceptInput(e.target.value)}
                onKeyDown={handleConceptKey}
                onBlur={addConcept}
                placeholder="e.g. Spot fleet allocation strategies, ALB vs NLB"
                className="w-full bg-ink-900/60 border border-white/10 focus:border-ember-500/50 rounded-lg px-3 py-2 text-ink-50 placeholder-ink-400 outline-none text-sm"
              />
            </Field>

            <Field label="Open questions / things to revisit">
              <textarea
                value={questions}
                onChange={(e) => setQuestions(e.target.value)}
                rows={2}
                placeholder="What are you still fuzzy on? What do you want to come back to?"
                className="w-full bg-ink-900/60 border border-white/10 focus:border-ember-500/50 rounded-lg px-3 py-2.5 text-ink-50 placeholder-ink-400 outline-none resize-none text-sm"
              />
            </Field>

            <div>
              <div className="small-caps text-ink-300 mb-2">Confidence on this material</div>
              <div className="flex items-center gap-3">
                <input
                  type="range" min="1" max="5" step="1"
                  value={confidence}
                  onChange={(e) => setConfidence(Number(e.target.value))}
                  className="flex-1"
                />
                <div className="w-32 text-right">
                  <span className="font-mono font-semibold text-ink-50">{confidence}/5</span>
                  <span className="text-ink-400 text-xs ml-2">{['','shaky','learning','solid','strong','teach it'][confidence]}</span>
                </div>
              </div>
            </div>

            {/* Mark course item complete */}
            {courseItem && !alreadyComplete && (
              <label className="flex items-center gap-3 p-3 rounded-lg border border-ember-500/20 bg-ember-500/5 cursor-pointer hover:bg-ember-500/10 transition">
                <input
                  type="checkbox"
                  checked={markComplete}
                  onChange={(e) => setMarkComplete(e.target.checked)}
                  className="w-4 h-4 accent-ember-500"
                />
                <div className="flex-1">
                  <div className="text-sm text-ink-100">Mark <span className="text-ink-50 font-medium">{courseItem.label}</span> as complete</div>
                  <div className="text-[11px] text-ink-400">Checks it off in the Course tab. You can always uncheck later.</div>
                </div>
              </label>
            )}
            {courseItem && alreadyComplete && (
              <div className="text-[11px] text-ink-400 px-2">
                ✓ This course item is already marked complete.
              </div>
            )}
          </div>

          <div className="flex items-center justify-between pt-3 border-t border-white/5">
            <button
              onClick={onSkip}
              className="text-ink-400 hover:text-ink-200 text-sm"
            >Skip recall (logs the session anyway)</button>
            <button
              onClick={save}
              disabled={!learned.trim()}
              className="px-6 py-2.5 rounded-full bg-ember-500 hover:bg-ember-400 disabled:opacity-40 disabled:cursor-not-allowed text-ink-900 font-semibold"
            >Save & continue</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function LogView({ sessions, onDelete, onExportMarkdown }) {
  const [searchQuery, setSearchQuery] = React.useState('');

  const filteredSessions = useMemo(() => {
    if (!searchQuery.trim()) return sessions;
    const q = searchQuery.toLowerCase();
    return sessions.filter(s => {
      const learned = (s.learned || '').toLowerCase();
      const concepts = (s.keyConcepts || []).join(' ').toLowerCase();
      const questions = (s.questions || '').toLowerCase();
      const courseTitle = (s.courseItem?.title || '').toLowerCase();
      return learned.includes(q) || concepts.includes(q) || questions.includes(q) || courseTitle.includes(q);
    });
  }, [sessions, searchQuery]);

  const grouped = useMemo(() => {
    const map = new Map();
    filteredSessions.forEach(s => {
      const k = dayKey(s.startedAt);
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(s);
    });
    return [...map.entries()].sort((a,b) => b[0].localeCompare(a[0]));
  }, [filteredSessions]);

  if (!sessions.length) {
    return (
      <div className="mt-20 text-center animate-fade-in">
        <div className="display-italic text-3xl text-ink-100 mb-2">Nothing logged yet.</div>
        <p className="text-ink-300">Complete your first focus session and the recall capture will land here.</p>
      </div>
    );
  }

  return (
    <div className="mt-10 animate-fade-in">
      <div className="flex items-center justify-between mb-4">
        <h2 className="display-italic text-3xl text-ink-50">Session log</h2>
        <button
          onClick={onExportMarkdown}
          className="px-4 py-2 rounded-full border border-white/10 hover:border-white/25 text-ink-100 text-sm"
        >Export today as Markdown</button>
      </div>

      {/* Search bar */}
      <div className="relative mb-6">
        <svg className="absolute left-3 top-1/2 -translate-y-1/2 text-ink-400" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          type="text"
          placeholder="Search notes, concepts, questions…"
          value={searchQuery}
          onChange={e => setSearchQuery(e.target.value)}
          className="w-full bg-ink-800/60 border border-white/10 rounded-xl pl-9 pr-4 py-2.5 text-sm text-ink-100 placeholder-ink-400 focus:outline-none focus:border-white/25"
        />
        {searchQuery && (
          <button onClick={() => setSearchQuery('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-ink-400 hover:text-ink-200">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        )}
      </div>

      {grouped.length === 0 && searchQuery ? (
        <div className="mt-10 text-center text-ink-300">No sessions match "{searchQuery}"</div>
      ) : (
        <div className="space-y-10">
          {grouped.map(([day, ses]) => {
            const total = ses.reduce((a,s) => a + s.durationSeconds, 0);
            const date = new Date(ses[0].startedAt);
            return (
              <section key={day}>
                <div className="flex items-baseline justify-between mb-3 pb-2 border-b border-white/5">
                  <h3 className="display-italic text-xl text-ink-100">
                    {date.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' })}
                  </h3>
                  <div className="small-caps text-ink-400">{ses.length} sessions · {fmtMinutes(total)}</div>
                </div>
                <div className="space-y-3">
                  {ses.map(s => <SessionCard key={s.id} session={s} onDelete={() => onDelete(s.id)} />)}
                </div>
              </section>
            );
          })}
        </div>
      )}
    </div>
  );
}
