function UpcomingReviewsCard({ upcomingReviews }) {
  const next = upcomingReviews[0];
  const nextDate = next ? new Date(next.item.nextDue) : null;
  const todayMs = startOfDay(new Date()).getTime();
  const days = nextDate ? Math.round((startOfDay(nextDate).getTime() - todayMs) / (1000 * 60 * 60 * 24)) : 0;
  const relLabel = days === 1 ? 'tomorrow' : `in ${days} days`;
  const dateLabel = nextDate ? nextDate.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' }) : '';

  return (
    <div className="rounded-xl border border-white/5 bg-ink-800/30 px-5 py-3.5 flex items-center gap-4">
      <div className="w-9 h-9 rounded-full bg-sage-500/15 border border-sage-500/30 flex items-center justify-center flex-shrink-0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#84a98c" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="20 6 9 17 4 12" />
        </svg>
      </div>
      <div className="flex-1 min-w-0">
        <div className="text-sm text-ink-100">All caught up on reviews</div>
        <div className="text-[11px] text-ink-400">
          {upcomingReviews.length} item{upcomingReviews.length !== 1 ? 's' : ''} in rotation · next returns {relLabel} <span className="text-ink-300">({dateLabel})</span>
        </div>
      </div>
    </div>
  );
}

function ReviewCard({ dueReviews, upcomingReviews, onStart }) {
  const oldestDays = useMemo(() => {
    if (!dueReviews.length) return 0;
    const oldest = dueReviews.reduce((acc, r) => {
      const d = new Date(r.item.nextDue).getTime();
      return d < acc ? d : acc;
    }, Infinity);
    const today = startOfDay(new Date()).getTime();
    return Math.max(0, Math.floor((today - oldest) / (1000 * 60 * 60 * 24)));
  }, [dueReviews]);
  // Estimate ~30 seconds per card review
  const estMins = Math.max(1, Math.round((dueReviews.length * 30) / 60));

  return (
    <div
      onClick={onStart}
      className="group cursor-pointer relative overflow-hidden rounded-2xl border border-ember-500/30 bg-gradient-to-br from-ember-500/15 via-ember-500/5 to-transparent p-5 hover:border-ember-500/50 transition"
    >
      {/* Subtle pulsing glow behind */}
      <div className="absolute -top-12 -right-12 w-48 h-48 bg-ember-500/10 rounded-full blur-3xl pointer-events-none animate-pulse-soft" />
      <div className="relative flex items-center gap-5">
        <div className="w-12 h-12 rounded-xl bg-ember-500/20 border border-ember-500/30 flex items-center justify-center flex-shrink-0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </div>
        <div className="flex-1 min-w-0">
          <div className="flex items-baseline gap-2 flex-wrap">
            <span className="display-italic text-xl text-ink-50">{dueReviews.length} item{dueReviews.length !== 1 ? 's' : ''} ready for review</span>
            <span className="text-[11px] text-ink-300 font-mono">~{estMins} min</span>
          </div>
          <div className="text-xs text-ink-300 mt-0.5">
            {oldestDays > 0
              ? `Oldest is ${oldestDays} day${oldestDays !== 1 ? 's' : ''} overdue`
              : 'All from today'}
            {upcomingReviews.length > 0 && (
              <span className="text-ink-400"> · {upcomingReviews.length} more in the next 7 days</span>
            )}
          </div>
        </div>
        <button
          onClick={(e) => { e.stopPropagation(); onStart(); }}
          className="px-5 py-2.5 rounded-full bg-ember-500 hover:bg-ember-400 text-ink-900 font-semibold text-sm flex-shrink-0"
        >Start review</button>
      </div>
    </div>
  );
}

function ReviewModal({ session, onGrade, onRetire, onClose }) {
  const { items, index, graded } = session;
  const [revealed, setRevealed] = useState(false);
  const isComplete = index >= items.length;

  // Reset reveal state when the card changes
  useEffect(() => { setRevealed(false); }, [index]);

  // Keyboard shortcuts
  useEffect(() => {
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); onClose(); return; }
      if (isComplete) return;
      if (!revealed) {
        if (e.key === ' ' || e.code === 'Space' || e.key === 'Enter') {
          e.preventDefault();
          setRevealed(true);
        }
        return;
      }
      // Revealed — grade keys
      if (e.key === '1') { e.preventDefault(); onGrade('forgot'); }
      else if (e.key === '2') { e.preventDefault(); onGrade('hazy'); }
      else if (e.key === '3') { e.preventDefault(); onGrade('solid'); }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [revealed, isComplete, onGrade, onClose]);

  if (isComplete) {
    const counts = graded.reduce((acc, g) => { acc[g.grade] = (acc[g.grade] || 0) + 1; return acc; }, {});
    return (
      <div className="fixed inset-0 z-50 flex items-center justify-center p-4 backdrop bg-ink-900/80 animate-fade-in">
        <div className="w-full max-w-md bg-ink-800 border border-white/10 rounded-2xl shadow-2xl animate-slide-up p-7 text-center">
          <div className="display-italic text-3xl text-ink-50 mb-2">All caught up</div>
          <p className="text-ink-300 text-sm mb-6">{graded.length} item{graded.length !== 1 ? 's' : ''} reviewed.</p>
          <div className="grid grid-cols-3 gap-2 mb-6">
            <ReviewStat label="Forgot" value={counts.forgot || 0} color="#dc2626" />
            <ReviewStat label="Hazy" value={counts.hazy || 0} color="#f59e0b" />
            <ReviewStat label="Solid" value={counts.solid || 0} color="#84a98c" />
          </div>
          {(counts.forgot || 0) > 0 && (
            <p className="text-[11px] text-ink-400 mb-5">
              The {counts.forgot} item{counts.forgot !== 1 ? 's' : ''} you forgot {counts.forgot !== 1 ? 'are' : 'is'} back tomorrow. Solid ones won&rsquo;t return for a while.
            </p>
          )}
          <button
            onClick={onClose}
            className="w-full px-6 py-2.5 rounded-full bg-ember-500 hover:bg-ember-400 text-ink-900 font-semibold"
          >Back to focus</button>
        </div>
      </div>
    );
  }

  const current = items[index];
  const sess = current.session;
  const item = current.item;
  const courseItem = sess.courseItemId ? COURSE_ITEM_BY_ID[sess.courseItemId] : null;
  const cats = (sess.categories || []).map(id => getCategory(id)).filter(Boolean);
  const sessionAge = Math.floor((Date.now() - new Date(sess.startedAt).getTime()) / (1000 * 60 * 60 * 24));

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 backdrop bg-ink-900/80 animate-fade-in">
      <div className="w-full max-w-2xl bg-ink-800 border border-white/10 rounded-2xl shadow-2xl animate-slide-up max-h-[90vh] overflow-y-auto">
        {/* Progress bar */}
        <div className="h-1 bg-white/5 rounded-t-2xl overflow-hidden">
          <div className="h-full bg-ember-500 transition-all" style={{ width: `${((index) / items.length) * 100}%` }} />
        </div>

        <div className="p-7 space-y-5">
          <div className="flex items-center justify-between gap-4 text-xs">
            <div className="flex items-center gap-3 text-ink-300">
              <span className="font-mono">Card {index + 1} of {items.length}</span>
              {item.reviewCount > 0 && <span className="text-ink-400">· seen {item.reviewCount}× before</span>}
            </div>
            <button onClick={onClose} className="text-ink-400 hover:text-ink-100 text-xs">Esc to exit</button>
          </div>

          {/* Card */}
          <div className="space-y-3">
            <div className="small-caps text-ember-500">Recall prompt</div>
            <div className="bg-ink-900/60 border border-white/5 rounded-xl p-5 space-y-3">
              {courseItem && (
                <div className="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-ember-500/10 border border-ember-500/30">
                  <span className="text-ember-400 font-mono text-[10px]">§{courseItem.sectionN}</span>
                  <span className="text-ember-200 text-xs">{courseItem.label}</span>
                </div>
              )}
              <div className="display-italic text-2xl text-ink-50 leading-snug">
                What did you learn about <span className="text-ember-300">{
                  sess.topic
                  || (courseItem && courseItem.label)
                  || (sess.resource && sess.resource.title)
                  || '(untitled)'
                }</span>?
              </div>
              {cats.length > 0 && (
                <div className="flex flex-wrap gap-1.5">
                  {cats.map(c => (
                    <span key={c.id} className="text-[10px] px-2 py-0.5 rounded-full" style={{ background: `hsl(${c.hue} 60% 30% / 0.5)`, color: `hsl(${c.hue} 70% 80%)` }}>
                      {c.label}
                    </span>
                  ))}
                </div>
              )}
              <div className="text-[11px] text-ink-400">
                Studied {sessionAge === 0 ? 'today' : `${sessionAge} day${sessionAge !== 1 ? 's' : ''} ago`} · {Math.round(sess.durationSeconds / 60)} min
              </div>
            </div>

            {!revealed ? (
              <div className="text-center py-2">
                <div className="text-xs text-ink-400 mb-3">Try to recall it before revealing.</div>
                <button
                  onClick={() => setRevealed(true)}
                  className="px-6 py-2.5 rounded-full border border-white/10 hover:border-white/30 text-ink-100"
                >Reveal your notes <kbd className="ml-2 px-1.5 py-0.5 rounded bg-ink-700 border border-white/10 text-[10px]">Space</kbd></button>
              </div>
            ) : (
              <div className="bg-ink-900/40 border border-white/5 rounded-xl p-5 space-y-4 animate-fade-in">
                <div className="small-caps text-ink-300">Your notes from then</div>
                {sess.recall?.learned && (
                  <div>
                    <div className="text-[10px] uppercase tracking-wider text-ink-400 mb-1">Learned</div>
                    <p className="text-ink-100 leading-relaxed whitespace-pre-wrap text-sm">{sess.recall.learned}</p>
                  </div>
                )}
                {sess.recall?.keyConcepts?.length > 0 && (
                  <div>
                    <div className="text-[10px] uppercase tracking-wider text-ink-400 mb-1">Key concepts</div>
                    <div className="flex flex-wrap gap-1.5">
                      {sess.recall.keyConcepts.map((c, i) => (
                        <span key={i} className="text-xs px-2 py-0.5 rounded-full bg-ember-500/10 text-ember-300 border border-ember-500/20">{c}</span>
                      ))}
                    </div>
                  </div>
                )}
                {sess.recall?.questions && (
                  <div>
                    <div className="text-[10px] uppercase tracking-wider text-ink-400 mb-1">Open questions you flagged</div>
                    <p className="text-ink-200 leading-relaxed whitespace-pre-wrap text-sm">{sess.recall.questions}</p>
                  </div>
                )}
                {sess.recall?.confidence && (
                  <div className="text-[11px] text-ink-400">
                    Past confidence: <span className="text-ink-200">{sess.recall.confidence}/5</span>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* Grading */}
          {revealed && (
            <div className="space-y-3 animate-fade-in">
              <div className="small-caps text-ink-300 text-center">How well did you remember?</div>
              <div className="grid grid-cols-3 gap-2">
                <GradeButton grade="forgot" hotkey="1" onClick={() => onGrade('forgot')} />
                <GradeButton grade="hazy"   hotkey="2" onClick={() => onGrade('hazy')} />
                <GradeButton grade="solid"  hotkey="3" onClick={() => onGrade('solid')} />
              </div>
              <div className="text-center pt-1">
                <button
                  onClick={onRetire}
                  className="text-[11px] text-ink-400 hover:text-ink-200"
                >Don&rsquo;t review this again — I&rsquo;ve got it</button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function GradeButton({ grade, hotkey, onClick }) {
  const config = {
    forgot: { label: 'Forgot',  desc: 'Back tomorrow',     bg: '#dc262615', border: '#dc262640', text: '#fca5a5' },
    hazy:   { label: 'Hazy',    desc: 'Same interval',     bg: '#f59e0b15', border: '#f59e0b40', text: '#fcd34d' },
    solid:  { label: 'Solid',   desc: 'Stretch the gap',   bg: '#84a98c15', border: '#84a98c40', text: '#cad2c5' },

function CourseView({ sessions, courseCompleted, currentCourseItemId, selectedCourseId, onSelectCourse, onPickItem, onToggleComplete }) {
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('all'); // all | unstarted | in-progress | done
  const [openSections, setOpenSections] = useState(() => new Set());

  // Active course data. Falls back to the default if the stored id is unknown
  // (e.g. after rolling back a course; never leaves the user in a broken state).
  const course = getCourse(selectedCourseId) || getCourse(DEFAULT_COURSE_ID);
  const activeSections = course.sections;
  const activeInfo = course.info;
  const idPrefix = course.idPrefix;
  const courseItems = getCourseItems(course.id);
  const courseTotalAll = courseItems.length;

  const completedSet = useMemo(() => new Set(courseCompleted), [courseCompleted]);

  // Sessions per item
  const sessionsByItem = useMemo(() => {
    const map = new Map();
    for (const s of sessions) {
      if (s.courseItemId) {
        if (!map.has(s.courseItemId)) map.set(s.courseItemId, []);
        map.get(s.courseItemId).push(s);
      }
    }
    return map;
  }, [sessions]);

  // Item state classifier
  function statusOf(itemId) {
    if (completedSet.has(itemId)) return 'done';
    if (sessionsByItem.has(itemId)) return 'in-progress';
    return 'unstarted';
  }

  // Filtered + searched sections (for the active course only)
  const filteredSections = useMemo(() => {
    const q = search.trim().toLowerCase();
    return activeSections.map(sec => {
      const items = [];
      sec.items.forEach((rawLabel, idx) => {
        const id = `${idPrefix}.s${sec.n}.${idx + 1}`;
        const meta = COURSE_ITEM_BY_ID[id];
        if (!meta) return;
        if (q && !meta.label.toLowerCase().includes(q) && !sec.title.toLowerCase().includes(q)) return;
        const status = statusOf(id);
        if (filter !== 'all' && status !== filter) return;
        items.push({ ...meta, status, sessionCount: sessionsByItem.get(id)?.length || 0 });
      });
      const totalInSection = sec.items.length;
      const completedInSection = sec.items.reduce((acc, _, idx) => {
        const id = `${idPrefix}.s${sec.n}.${idx + 1}`;
        return acc + (completedSet.has(id) ? 1 : 0);
      }, 0);
      const studiedInSection = sec.items.reduce((acc, _, idx) => {
        const id = `${idPrefix}.s${sec.n}.${idx + 1}`;
        return acc + (sessionsByItem.has(id) && !completedSet.has(id) ? 1 : 0);
      }, 0);
      return { sec, items, totalInSection, completedInSection, studiedInSection };
    }).filter(g => g.items.length > 0);
  }, [search, filter, completedSet, sessionsByItem, activeSections, idPrefix]);

  // Auto-expand sections on search
  useEffect(() => {
    if (search.trim()) {
      setOpenSections(new Set(filteredSections.map(g => g.sec.n)));
    }
  }, [search, filteredSections]);

  // Reset section expansion state when switching courses (different section numbers)
  useEffect(() => {
    setOpenSections(new Set());
    setSearch('');
  }, [selectedCourseId]);

  function toggleSection(n) {
    setOpenSections(prev => {
      const next = new Set(prev);
      if (next.has(n)) next.delete(n); else next.add(n);
      return next;
    });
  }

  // Course-scoped stats. We only count completion and session time for items
  // that belong to the *active* course, so switching between SAA and DVA shows
  // each course's independent progress.
  const activeItemIds = useMemo(() => new Set(courseItems.map(i => i.id)), [courseItems]);
  const totalDone = [...completedSet].filter(id => activeItemIds.has(id)).length;
  const totalStudied = [...sessionsByItem.keys()].filter(id => activeItemIds.has(id) && !completedSet.has(id)).length;
  const overallPct = courseTotalAll > 0 ? (totalDone / courseTotalAll) * 100 : 0;
  const totalFocusOnCourse = sessions
    .filter(s => s.courseItemId && activeItemIds.has(s.courseItemId))
    .reduce((a,s) => a + s.durationSeconds, 0);

  // Per-course pill summary
  const coursePills = listCourses().map(c => {
    const cItems = getCourseItems(c.id);
    const cIds = new Set(cItems.map(i => i.id));
    const done = [...completedSet].filter(id => cIds.has(id)).length;
    return { id: c.id, code: c.info.code, title: c.info.title, done, total: cItems.length };
  });

  return (
    <div className="mt-10 animate-fade-in space-y-6">
      {/* Course switcher — pill tabs. Hidden if only one course exists. */}
      {coursePills.length > 1 && (
        <div className="flex items-center gap-2 flex-wrap">
          <span className="small-caps text-ink-400 text-[11px] mr-1">Exam</span>
          {coursePills.map(p => {
            const isActive = p.id === course.id;
            const pct = p.total > 0 ? Math.round((p.done / p.total) * 100) : 0;
            return (
              <button
                key={p.id}
                onClick={() => onSelectCourse && onSelectCourse(p.id)}
                className={`group px-3.5 py-1.5 rounded-full border text-xs font-medium transition flex items-center gap-2 ${
                  isActive
                    ? 'bg-ember-500 border-ember-500 text-ink-900 shadow-sm'
                    : 'bg-ink-800/60 border-white/10 text-ink-200 hover:border-white/25 hover:text-ink-50'
                }`}
                title={p.title}
              >
                <span className="font-mono tracking-wide">{p.code}</span>
                <span className={`text-[10px] ${isActive ? 'text-ink-800/70' : 'text-ink-400'}`}>
                  {p.done}/{p.total} · {pct}%
                </span>
              </button>
            );
          })}
        </div>
      )}

      {/* Header */}
      <div className="bg-gradient-to-br from-ember-500/10 to-transparent border border-white/5 rounded-2xl p-6">
        <div className="flex items-start justify-between gap-6 flex-wrap">
          <div>
            <div className="small-caps text-ember-400 mb-1">{activeInfo.platform} · {activeInfo.code}</div>
            <h2 className="display-italic text-3xl text-ink-50">{activeInfo.title}</h2>
            <div className="text-ink-300 text-sm mt-1">with {activeInfo.instructor}</div>
          </div>
          <div className="text-right">
            <div className="font-mono text-3xl text-ink-50">{totalDone}<span className="text-ink-400 text-lg">/{courseTotalAll}</span></div>
            <div className="text-xs text-ink-300">items completed · {fmtMinutes(totalFocusOnCourse)} logged</div>
          </div>
        </div>

        {/* Overall progress bar */}
        <div className="mt-5">
          <div className="h-1.5 rounded-full bg-white/5 overflow-hidden">
            <div className="h-full bg-gradient-to-r from-ember-500 to-ember-400 rounded-full transition-all duration-500" style={{ width: `${overallPct}%` }} />
          </div>
          <div className="flex justify-between text-[11px] text-ink-400 mt-1.5">
            <span>{Math.round(overallPct)}% through the course</span>
            <span>{totalStudied} item{totalStudied !== 1 ? 's' : ''} in progress · {courseTotalAll - totalDone - totalStudied} untouched</span>
          </div>
        </div>
      </div>

      {/* Search + filter */}
      <div className="flex gap-2 flex-wrap">
        <div className="flex-1 min-w-[240px] relative">
          <input
            type="text"
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            placeholder="Search course (e.g. Lambda Concurrency, KMS)"
            className="w-full bg-ink-900/60 border border-white/10 focus:border-ember-500/50 rounded-full px-4 py-2 pl-10 text-ink-50 placeholder-ink-400 outline-none text-sm"
          />
          <svg className="absolute left-3 top-1/2 -translate-y-1/2 text-ink-400" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.35-4.35" /></svg>
        </div>
        <div className="flex gap-1 p-1 rounded-full bg-ink-800/60 border border-white/5">
          {[
            { id: 'all',         label: 'All' },
            { id: 'unstarted',   label: 'Untouched' },
            { id: 'in-progress', label: 'In progress' },
            { id: 'done',        label: 'Done' },
          ].map(f => (
            <button
              key={f.id}
              onClick={() => setFilter(f.id)}
              className={`px-3 py-1 text-xs font-medium rounded-full transition ${
                filter === f.id ? 'bg-ink-50 text-ink-900' : 'text-ink-200 hover:text-ink-50'
              }`}
            >{f.label}</button>
          ))}
        </div>
      </div>

      {/* Section list */}
      {filteredSections.length === 0 ? (
        <div className="text-center py-16 text-ink-300">
          <div className="display-italic text-xl text-ink-100 mb-1">Nothing matches.</div>
          <p className="text-sm">Try a different search or filter.</p>
        </div>
      ) : (
        <div className="space-y-2">
          {filteredSections.map(({ sec, items, totalInSection, completedInSection, studiedInSection }) => {
            const isOpen = openSections.has(sec.n) || search.trim().length > 0;
            const pct = (completedInSection / totalInSection) * 100;
            return (
              <div key={sec.n} className="bg-ink-800/40 border border-white/5 rounded-xl overflow-hidden">
                <button
                  onClick={() => toggleSection(sec.n)}
                  className="w-full px-5 py-4 flex items-center gap-4 hover:bg-white/[0.02] transition text-left"
                >
                  <span className="text-ember-500 font-mono text-xs w-7 flex-shrink-0">§{sec.n}</span>
                  <div className="flex-1 min-w-0">
                    <div className="text-ink-50 font-medium truncate">{sec.title}</div>
                    <div className="flex items-center gap-3 mt-1">
                      <div className="flex-1 h-1 max-w-[200px] rounded-full bg-white/5 overflow-hidden">
                        <div className="h-full bg-ember-500 rounded-full transition-all" style={{ width: `${pct}%` }} />
                      </div>
                      <span className="text-[11px] text-ink-400 font-mono">{completedInSection}/{totalInSection}</span>
                      {studiedInSection > 0 && <span className="text-[11px] text-ember-400">· {studiedInSection} active</span>}
                    </div>
                    <div className="flex flex-wrap gap-1 mt-1.5">
                      {sec.cats.map(catId => {
                        const cat = getCategory(catId);
                        if (!cat) return null;
                        return (
                          <span key={catId} className="text-[9px] uppercase tracking-wider px-1.5 py-0.5 rounded" style={{ background: `hsl(${cat.hue} 60% 20%)`, color: `hsl(${cat.hue} 70% 75%)` }}>{cat.label}</span>
                        );
                      })}
                    </div>
                  </div>
                  <span className="text-ink-400 text-xs flex-shrink-0" style={{ transform: isOpen ? 'rotate(90deg)' : 'rotate(0)', transition: 'transform 0.2s' }}>▸</span>
                </button>

                {isOpen && (
                  <div className="border-t border-white/5">
                    {items.map(item => (
                      <CourseItemRow
                        key={item.id}
                        item={item}
                        active={currentCourseItemId === item.id}
                        onPick={() => onPickItem(item.id)}
                        onToggleComplete={() => onToggleComplete(item.id)}
                      />
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function CourseItemRow({ item, active, onPick, onToggleComplete }) {
  const isDone = item.status === 'done';
  const isInProgress = item.status === 'in-progress';

  const typeBadge = item.type === 'quiz' ? { label: 'Quiz', color: '#fbbf24' } :
                    item.type === 'test' ? { label: 'Test', color: '#f472b6' } :
                    null;

  return (
    <div className={`group flex items-center gap-3 px-5 py-2.5 hover:bg-white/[0.02] transition ${active ? 'bg-ember-500/10' : ''}`}>
      <button
        onClick={onToggleComplete}
        className={`w-5 h-5 rounded border-2 flex items-center justify-center flex-shrink-0 transition ${
          isDone ? 'border-ember-500 bg-ember-500' : 'border-white/20 hover:border-white/40'
        }`}
        title={isDone ? 'Mark incomplete' : 'Mark complete'}
      >
        {isDone && <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0b0a08" strokeWidth="3"><polyline points="20 6 9 17 4 12" /></svg>}
      </button>
      <div className="flex-1 min-w-0">
        <div className={`text-sm truncate ${isDone ? 'text-ink-400 line-through' : 'text-ink-100'}`}>
          {item.label}
        </div>
        {(isInProgress || typeBadge) && (
          <div className="flex items-center gap-2 mt-0.5">
            {typeBadge && (
              <span className="text-[9px] uppercase tracking-wider px-1.5 py-0.5 rounded font-semibold" style={{ background: `${typeBadge.color}20`, color: typeBadge.color }}>{typeBadge.label}</span>
            )}
            {isInProgress && (
              <span className="text-[10px] text-ember-400">{item.sessionCount} session{item.sessionCount !== 1 ? 's' : ''} logged</span>
            )}
          </div>
        )}
      </div>
      {active && <span className="text-[10px] text-ember-400 font-semibold">CURRENT</span>}
      <button
        onClick={onPick}
        disabled={active}
        className={`text-xs px-3 py-1 rounded-full border transition flex-shrink-0 ${
          active
            ? 'border-ember-500/50 text-ember-300 cursor-default'
            : 'border-white/10 text-ink-200 hover:border-ember-500/50 hover:text-ember-300 opacity-0 group-hover:opacity-100'
        }`}
      >Study</button>
    </div>
  );
}

function CoverageView({ sessions }) {
  const coverage = useMemo(() => {
    const map = new Map();
    AWS_CATEGORIES.forEach(c => map.set(c.id, { id: c.id, label: c.label, hue: c.hue, totalSeconds: 0, count: 0, lastTouched: null }));
    sessions.forEach(s => {
      (s.categories || []).forEach(catId => {
        if (!map.has(catId)) return;
        const e = map.get(catId);
        // Distribute time evenly across the categories tagged on a session
        const split = s.durationSeconds / (s.categories.length || 1);
        e.totalSeconds += split;
        e.count += 1;
        if (!e.lastTouched || s.startedAt > e.lastTouched) e.lastTouched = s.startedAt;
      });
    });
    return [...map.values()].sort((a,b) => b.totalSeconds - a.totalSeconds);
  }, [sessions]);

  const maxSecs = Math.max(...coverage.map(c => c.totalSeconds), 1);
  const totalCovered = coverage.filter(c => c.count > 0).length;
  const gapsRecent = coverage.filter(c => !c.lastTouched);
  const gapsStale = coverage.filter(c => c.lastTouched && daysBetween(c.lastTouched) >= 7);

  return (
    <div className="mt-10 animate-fade-in space-y-10">
      <div>
        <h2 className="display-italic text-3xl text-ink-50 mb-2">Coverage map</h2>
        <p className="text-ink-300">
          Time distribution across AWS service areas. {totalCovered} of {AWS_CATEGORIES.length} areas touched.
          Brighter cells = more time. Watch for the <span className="text-ember-300">gaps</span> below.
        </p>
      </div>

      {/* Heatmap-ish grid */}
      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
        {coverage.map(c => {
          const intensity = Math.min(c.totalSeconds / maxSecs, 1);
          const days = c.lastTouched ? daysBetween(c.lastTouched) : null;
          return (
            <div
              key={c.id}
              className="heat-cell rounded-xl p-4 border relative overflow-hidden"
              style={{
                background: c.count > 0
                  ? `linear-gradient(135deg, hsl(${c.hue} 60% ${10 + intensity*30}%), hsl(${c.hue} 50% ${5 + intensity*15}%))`
                  : 'rgba(255,255,255,0.02)',
                borderColor: c.count > 0 ? `hsl(${c.hue} 60% ${30 + intensity*20}% / 0.5)` : 'rgba(255,255,255,0.05)',
              }}
            >
              <div className="font-medium text-ink-50">{c.label}</div>
              {c.count > 0 ? (
                <div className="mt-2">
                  <div className="font-mono text-2xl text-ink-50">{fmtMinutes(c.totalSeconds)}</div>
                  <div className="text-[11px] text-ink-200">
                    {c.count} session{c.count !== 1 ? 's' : ''}
                    {days !== null && (
                      <span className={days >= 7 ? 'text-ember-300 ml-1' : 'ml-1'}>
                        · {days === 0 ? 'today' : `${days}d ago`}
                      </span>
                    )}
                  </div>
                </div>
              ) : (
                <div className="mt-2">
                  <div className="text-ink-400 text-sm italic">Untouched</div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Gap callouts */}
      {(gapsRecent.length > 0 || gapsStale.length > 0) && (
        <div className="bg-ember-500/5 border border-ember-500/20 rounded-2xl p-6">
          <div className="display-italic text-xl text-ember-300 mb-3">Gaps to consider</div>
          {gapsRecent.length > 0 && (
            <div className="mb-3">
              <div className="small-caps text-ink-300 mb-1.5">Never logged</div>
              <div className="flex flex-wrap gap-1.5">
                {gapsRecent.map(c => (
                  <span key={c.id} className="text-xs px-2.5 py-1 rounded-full bg-ink-800 text-ink-100 border border-white/10">{c.label}</span>
                ))}
              </div>
            </div>
          )}
          {gapsStale.length > 0 && (
            <div>
              <div className="small-caps text-ink-300 mb-1.5">Not touched in 7+ days</div>
              <div className="flex flex-wrap gap-1.5">
                {gapsStale.map(c => (
                  <span key={c.id} className="text-xs px-2.5 py-1 rounded-full bg-ink-800 text-ink-100 border border-ember-500/20">
                    {c.label}<span className="text-ink-400 ml-1">· {daysBetween(c.lastTouched)}d</span>
                  </span>
                ))}
              </div>
            </div>
          )}
        </div>
      )}

      {/* Recent recall pulls */}
      <RecallPulls sessions={sessions} />
    </div>
  );
}

function RecallPulls({ sessions }) {
  // Pull recent open-questions and shaky-confidence sessions for revisit
  const revisit = sessions
    .filter(s => s.recall && (s.recall.questions?.trim() || (s.recall.confidence && s.recall.confidence <= 2)))
    .slice(0, 8);

  if (!revisit.length) return null;

  return (
    <div>
      <div className="display-italic text-xl text-ink-50 mb-3">Worth revisiting</div>
      <p className="text-ink-300 text-sm mb-4">Sessions where you flagged open questions or low confidence.</p>
      <div className="space-y-2">
        {revisit.map(s => (
          <div key={s.id} className="bg-ink-800/40 border border-white/5 rounded-lg p-4">
            <div className="flex items-center gap-2 mb-1">
              <span className="text-ink-50 font-medium">{s.topic || (s.resource && s.resource.title) || 'Untitled'}</span>
              <span className="text-ink-400 text-xs">· {fmtDate(s.startedAt)}</span>
              {s.recall.confidence && <ConfidenceBadge level={s.recall.confidence} />}
            </div>
            {s.recall.questions && <p className="text-ink-200 text-sm whitespace-pre-wrap">{s.recall.questions}</p>}
          </div>
        ))}
      </div>
    </div>
  );
}

function SettingsView({ settings, setSettings, setMusic, applyPreset, exportJSON, importJSON, clearAll, requestNotifications, sessionCount, onTestMusic }) {

// Lists localStorage snapshots if any exist, offers one-click restore.
// This is the "oh god I cleared cache" last-ditch recovery UI — except it only helps
// if the cache clear didn't also nuke localStorage. Most cache clears do both.
function SnapshotRecoveryPanel() {
  const [snapshots, setSnapshots] = React.useState(() => {
    try {
      const raw = localStorage.getItem('refocus.snapshots');
      return raw ? JSON.parse(raw) : [];
    } catch { return []; }
  });

  if (!snapshots || snapshots.length === 0) return null;

  function restore(snap) {
    if (!confirm(`Restore your data from snapshot taken on ${snap.day}?\n\nThis overwrites current state. Reload after to see changes.`)) return;
    localStorage.setItem('refocus.v1', JSON.stringify(snap.state));
    alert('Restored. Refresh the page (Cmd+R) to see your data.');
  }

  return (
    <details className="rounded-xl bg-ink-800/30 border border-white/5 mt-3">
      <summary className="px-4 py-2.5 text-xs text-ink-300 hover:text-ink-100 flex items-center justify-between">
        <span>Local snapshots ({snapshots.length} available — emergency recovery)</span>
        <span className="text-ink-500">▾</span>
      </summary>
      <div className="px-4 pb-3 pt-1 space-y-1.5">
        <p className="text-[11px] text-ink-400 leading-relaxed">
          These localStorage snapshots survive page reloads but NOT browser cache clears.
          For true safety, rely on the downloaded .json backups above.
        </p>
        {snapshots.map((s) => (
          <button
            key={s.day}
            onClick={() => restore(s)}
            className="w-full text-left px-3 py-2 rounded-lg bg-ink-800/60 border border-white/10 hover:border-ember-500/40 hover:bg-ink-800 flex items-center justify-between"
          >
            <div>
              <div className="text-xs font-semibold text-ink-100">{s.day}</div>
              <div className="text-[10px] text-ink-400">{new Date(s.at).toLocaleString()}</div>
            </div>
            <span className="text-[10px] text-ember-400">Restore</span>
          </button>
        ))}
      </div>
    </details>
  );
}

function NumberRow({ label, value, min, max, onChange }) {
  return (

        <button
          onClick={() => onChange(Math.max(min, value - 1))}
          className="w-8 h-8 rounded-full border border-white/10 hover:border-white/25 text-ink-100"
        >−</button>
        <input
          type="number"
          min={min} max={max}
          value={value}
          onChange={(e) => onChange(Math.max(min, Math.min(max, Number(e.target.value) || min)))}
          className="w-16 text-center bg-ink-900/60 border border-white/10 rounded-lg py-1 text-ink-50 font-mono outline-none focus:border-ember-500/50"
        />
        <button

          className="w-8 h-8 rounded-full border border-white/10 hover:border-white/25 text-ink-100"
        >+</button>
      </div>
    </div>
  );
}

function MusicSettings({ music, setMusic, onTestMusic }) {
  const [customUrl, setCustomUrl] = useState('');
  const [customName, setCustomName] = useState('');
  const [error, setError] = useState('');

  const allPlaylists = [
    ...BUILTIN_PLAYLISTS.map(p => ({ ...p, builtin: true })),
    ...music.customPlaylists.map(p => ({ ...p, builtin: false, accent: '#84a98c' })),
  ];

  function selectPlaylist(id) {
    setMusic({ selectedPlaylistId: id });
  }

  function addCustom() {
    const url = normalizeSpotifyUrl(customUrl);
    if (!url) {
      setError('That doesn\u2019t look like a Spotify link. Paste a playlist URL or URI.');
      return;
    }
    if (!customName.trim()) {
      setError('Give it a name so you can find it later.');
      return;
    }
    const id = 'custom-' + Math.random().toString(36).slice(2, 8);
    const newPlaylist = { id, name: customName.trim(), url, description: 'Custom' };
    setMusic({ customPlaylists: [...music.customPlaylists, newPlaylist] });
    setCustomUrl('');
    setCustomName('');
    setError('');
  }

  function removeCustom(id) {
    if (!confirm('Remove this playlist?')) return;
    const next = music.customPlaylists.filter(p => p.id !== id);
    const patch = { customPlaylists: next };
    if (music.selectedPlaylistId === id) patch.selectedPlaylistId = 'baroque-focus';
    setMusic(patch);
  }

  return (
    <section className="space-y-4">
      <div className="flex items-center justify-between">
        <div className="small-caps text-ink-300">Music</div>
        <span className="text-[10px] text-ink-400 flex items-center gap-1.5">
          <span className="w-1.5 h-1.5 rounded-full" style={{ background: SPOTIFY_GREEN }} />
          via Spotify
        </span>
      </div>

      <p className="text-xs text-ink-400 leading-relaxed">
        Pick a playlist. The selected one launches when you start a focus session (if auto-launch is on),
        or you can hit the Spotify icon in the right panel to open it manually anytime.
        Opens in the Spotify desktop app if installed, web player otherwise.
      </p>

      {/* Playlist selector */}
      <div className="grid sm:grid-cols-2 gap-2">
        {allPlaylists.map(p => {
          const active = music.selectedPlaylistId === p.id;
          return (
            <div
              key={p.id}
              onClick={() => selectPlaylist(p.id)}
              className={`group cursor-pointer rounded-xl p-3 border transition relative ${
                active
                  ? 'border-transparent'
                  : 'border-white/8 bg-ink-800/40 hover:border-white/15'
              }`}
              style={active ? { background: `${p.accent}15`, borderColor: `${p.accent}50` } : {}}
            >
              <div className="flex items-center gap-2">
                <div
                  className="w-2.5 h-2.5 rounded-full flex-shrink-0"
                  style={{ background: active ? p.accent : 'rgba(255,255,255,0.15)' }}
                />
                <div className="flex-1 min-w-0">
                  <div className="text-ink-50 font-medium text-sm truncate">{p.name}</div>
                  <div className="text-ink-300 text-[11px] truncate">{p.description || 'Custom playlist'}</div>
                </div>
                {!p.builtin && (
                  <button
                    onClick={(e) => { e.stopPropagation(); removeCustom(p.id); }}
                    className="opacity-0 group-hover:opacity-100 text-ink-400 hover:text-red-400 text-xs px-1"
                    title="Remove"
                  >×</button>
                )}
              </div>
            </div>
          );
        })}
      </div>

      <ToggleRow
        label="Auto-launch on focus start"
        desc="Opens Spotify in a new tab/window when you click Start. Music keeps playing through breaks."
        on={music.enabled}
        onChange={(v) => setMusic({ enabled: v })}
      />

      <div className="flex gap-2">
        <button
          onClick={onTestMusic}
          className="px-4 py-2 rounded-full text-sm font-medium transition hover:opacity-90"
          style={{ background: SPOTIFY_GREEN, color: '#0b0a08' }}
        >▶ Open selected now</button>
      </div>

      {/* Add custom playlist */}
      <details className="border border-white/8 rounded-xl bg-ink-800/30">
        <summary className="px-4 py-3 cursor-pointer text-sm text-ink-100 hover:text-ink-50 flex items-center justify-between">
          <span>Add a custom playlist</span>
          <span className="text-ink-400 text-xs">+</span>
        </summary>
        <div className="px-4 pb-4 space-y-3">
          <Field label="Spotify playlist link or URI">
            <input
              type="text"
              value={customUrl}
              onChange={(e) => { setCustomUrl(e.target.value); setError(''); }}
              placeholder={"https://open.spotify.com/playlist/\u2026 or spotify:playlist:\u2026"}
              className="w-full bg-ink-900/60 border border-white/10 focus:border-ember-500/50 rounded-lg px-3 py-2 text-ink-50 placeholder-ink-400 outline-none font-mono text-xs"
            />
          </Field>
          <Field label="Display name">
            <input
              type="text"
              value={customName}

              className="w-full bg-ink-900/60 border border-white/10 focus:border-ember-500/50 rounded-lg px-3 py-2 text-ink-50 placeholder-ink-400 outline-none text-sm"
            />
          </Field>
          {error && <div className="text-xs text-red-400">{error}</div>}
          <button

// ── STREAK CELEBRATION ──────────────────────────────────────────────────────
// Duolingo-style full-screen burst when the daily goal is met.
// Giant animated flame (SVG) + animated streak counter + confetti particles.
// Auto-closes after 5s, or tap/click to dismiss.
function StreakCelebration({ streakDays, isNewRecord, milestone, onClose }) {
  const [displayNum, setDisplayNum] = React.useState(Math.max(0, streakDays - 1));
  const [visible, setVisible] = React.useState(false);

  // Enter animation + number tick-up
  React.useEffect(() => {
    const enterT = setTimeout(() => setVisible(true), 40);
    // Tick the number up from (streakDays - 1) → streakDays with a tiny delay
    const tickT = setTimeout(() => setDisplayNum(streakDays), 650);
    const autoCloseT = setTimeout(() => onClose(), 5200);
    return () => {
      clearTimeout(enterT);
      clearTimeout(tickT);
      clearTimeout(autoCloseT);
    };
  }, [streakDays, onClose]);

  // ESC / Enter / Space / Click to dismiss
  React.useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        onClose();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);

  // Flame color by tier
  const tierStyle = {
    kindle:     { flameA: '#fb923c', flameB: '#f59e0b', glow: '#f59e0b55' },
    spark:      { flameA: '#f97316', flameB: '#ef4444', glow: '#f9731666' },
    week:       { flameA: '#f59e0b', flameB: '#ef4444', glow: '#f59e0b77' },
    fortnight:  { flameA: '#f59e0b', flameB: '#dc2626', glow: '#f59e0b88' },
    month:      { flameA: '#fbbf24', flameB: '#dc2626', glow: '#fbbf2499' },
    'half-ton': { flameA: '#fde047', flameB: '#f97316', glow: '#fde04799' },
    century:    { flameA: '#a78bfa', flameB: '#f472b6', glow: '#a78bfa99' },
    legendary:  { flameA: '#c084fc', flameB: '#ec4899', glow: '#c084fcaa' },
    mythic:     { flameA: '#fde047', flameB: '#ec4899', glow: '#fde047aa' },
  }[milestone.tier] || { flameA: '#fb923c', flameB: '#f59e0b', glow: '#f59e0b55' };

  // Confetti particles — 40 of them, each with randomized flight path
  const confetti = React.useMemo(() => {
    const colors = ['#fbbf24', '#f472b6', '#a78bfa', '#34d399', '#60a5fa', '#f97316'];
    return Array.from({ length: 40 }).map((_, i) => ({
      id: i,
      color: colors[i % colors.length],
      dx: (Math.random() - 0.5) * 700,
      dy: -200 - Math.random() * 400,
      rot: (Math.random() - 0.5) * 720,
      delay: Math.random() * 0.2,
      size: 6 + Math.random() * 8,
    }));
  }, []);

  return (
    <div
      onClick={onClose}
      className={`fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm transition-opacity duration-300 cursor-pointer ${
        visible ? 'opacity-100' : 'opacity-0'
      }`}
      style={{ backgroundImage: `radial-gradient(circle at center, ${tierStyle.glow} 0%, transparent 60%)` }}
    >
      {/* Confetti layer */}
      <div className="absolute inset-0 overflow-hidden pointer-events-none">
        {visible && confetti.map(p => (
          <span
            key={p.id}
            className="absolute left-1/2 top-1/2 rounded-sm"
            style={{
              width: `${p.size}px`,
              height: `${p.size}px`,
              background: p.color,
              animation: `streakConfetti 1.4s cubic-bezier(0.2, 0.7, 0.3, 1) forwards`,
              animationDelay: `${p.delay}s`,
              '--dx': `${p.dx}px`,
              '--dy': `${p.dy}px`,
              '--rot': `${p.rot}deg`,
            }}
          />
        ))}
      </div>

      {/* Center stack */}
      <div className={`relative flex flex-col items-center gap-5 transition-all duration-500 ${
        visible ? 'scale-100 opacity-100' : 'scale-75 opacity-0'
      }`}>
        {/* Flame — SVG with gradient + pulsing glow + flicker animation */}
        <div
          className="relative"
          style={{
            animation: visible ? 'streakFlameFloat 2.4s ease-in-out infinite' : 'none',
            filter: `drop-shadow(0 0 40px ${tierStyle.glow}) drop-shadow(0 0 80px ${tierStyle.glow})`,
          }}
        >
          <svg width="220" height="260" viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id={`flame-grad-${milestone.tier}`} x1="0" y1="1" x2="0" y2="0">
                <stop offset="0%"   stopColor={tierStyle.flameB} />
                <stop offset="55%"  stopColor={tierStyle.flameA} />
                <stop offset="100%" stopColor="#fef3c7" />
              </linearGradient>
              <radialGradient id={`flame-core-${milestone.tier}`} cx="50%" cy="70%" r="50%">
                <stop offset="0%"   stopColor="#fff7ed" stopOpacity="0.9" />
                <stop offset="60%"  stopColor={tierStyle.flameA} stopOpacity="0.6" />
                <stop offset="100%" stopColor={tierStyle.flameB} stopOpacity="0" />
              </radialGradient>
            </defs>
            {/* Flame body — stylized teardrop */}
            <path
              d="M110 20 C 60 80, 40 120, 55 170 C 70 220, 110 240, 110 240 C 110 240, 150 220, 165 170 C 180 120, 160 80, 110 20 Z"
              fill={`url(#flame-grad-${milestone.tier})`}
              style={{ animation: 'streakFlameFlicker 1.2s ease-in-out infinite alternate' }}
            />
            {/* Inner glow */}
            <ellipse cx="110" cy="180" rx="38" ry="50" fill={`url(#flame-core-${milestone.tier})`} />
          </svg>

          {/* Streak number overlaid on the flame */}
          <div
            className="absolute inset-0 flex items-center justify-center pointer-events-none"
            style={{ paddingTop: '40px' }}
          >
            <span
              className="display-italic font-bold text-ink-900 leading-none"
              style={{

// ============================================================================
// STATS
// ============================================================================

function computeStats(sessions, flashcardState = {}) {
  const today = sessions.filter(s => isToday(s.startedAt));
  // Totals rule: each completed, non-skipped session counts as one Pomodoro
  // worth its configured duration (e.g. 25 min), not wall-clock time. Partial
  // or skipped sessions don't add to totals. `completed` is set at save-time
  // as "ran for at least 90% of configured". Fallback to durationSeconds for
  // sessions saved before configuredDurationSeconds was tracked (legacy data).
  const isCountable = (s) => s.completed && !s.skipped;
  const countableValue = (s) => s.configuredDurationSeconds || s.durationSeconds;
  const todaySeconds = today.filter(isCountable).reduce((a, s) => a + countableValue(s), 0);
  const totalSeconds = sessions.filter(isCountable).reduce((a, s) => a + countableValue(s), 0);
  const todayCompletedSessions = today.filter(isCountable).length;

  // Active-day set: any day with a focus session OR any graded flashcard.
  // Grade history entries (from gradeReviewItem) store their timestamp on
  // `date`. We also check `at` as a defensive fallback in case any historical
  // entry used that key — but the canonical field is `date`.
  const days = new Set(sessions.map(s => dayKey(s.startedAt)));
  Object.values(flashcardState || {}).forEach(item => {
    if (!item || !item.history) return;
    (item.history || []).forEach(h => {
      const ts = h && (h.date || h.at);
      if (ts) days.add(dayKey(ts));
    });
  });

  // Count today's flashcard grades for the daily-goal meter
  const todayKey = dayKey(new Date().toISOString());
  let todayFlashcardsGraded = 0;
  Object.values(flashcardState || {}).forEach(item => {
    if (!item || !item.history) return;
    (item.history || []).forEach(h => {
      const ts = h && (h.date || h.at);
      if (ts && dayKey(ts) === todayKey) todayFlashcardsGraded++;
    });
  });

  let streak = 0;
  let cursor = startOfDay(new Date());
  if (!days.has(dayKey(cursor.toISOString()))) {
    cursor.setDate(cursor.getDate() - 1);
    if (!days.has(dayKey(cursor.toISOString()))) {
      return {
        todaySessions: todayCompletedSessions, todaySeconds, totalSeconds, streakDays: 0,
        todayFlashcardsGraded, goalMetToday: false, activeDays: days,
      };
    }
  }
  while (days.has(dayKey(cursor.toISOString()))) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }

  // Goal met today if: at least 1 focus session OR at least 5 flashcard grades.
  // Note: goal uses today.length (any session), not just completed ones — showing
  // up counts. But the Today number/time displayed in the header uses only
  // completed Pomodoros so minutes and count stay consistent with each other.
  const goalMetToday = today.length >= 1 || todayFlashcardsGraded >= 5;

  return {
    todaySessions: todayCompletedSessions,
    todaySeconds,
    totalSeconds,
    streakDays: streak,
    todayFlashcardsGraded,
    goalMetToday,
    activeDays: days,
  };
}

// State helpers
function initialFlashcardItem() {
  return {
    interval: 1,
    nextDue: addDays(startOfDay(new Date()), 1).toISOString(),
    reviewCount: 0,
    history: [],
    retired: false,
    firstSeenAt: new Date().toISOString(),
  };
}

function getDueFlashcards(cards, flashcardState) {
  const todayMs = startOfDay(new Date()).getTime();
  return cards.filter(c => {
    const item = flashcardState[c.id];
    if (!item || item.retired) return false;
    return new Date(item.nextDue).getTime() <= todayMs;
  });
}

// ============================================================================
// MASTERY ENGINE — Phase 3 adaptive weakness targeting
// ----------------------------------------------------------------------------
// Pure functions that analyze quizBankState to produce:
//   • Per-category mastery scores
//   • Per-course readiness (0-100)
//   • Weak-spot question selection weights
//
// Design choices:
//   RECENT_WINDOW=10  — only last 10 attempts per category count toward accuracy.
//                       This lets you recover from a rough early run and reflects
//                       current knowledge, not lifetime history.
//   CONFIDENCE_FLOOR=8 — needs at least 8 attempts before a low score triggers
//                       "weak" classification. Two unlucky tries shouldn't label
//                       a category as a weakness.
//   FRESHNESS_HALFLIFE=14 — accuracy decays over time. If you nailed VPC last
//                       month but haven't touched it since, we treat it as
//                       stale (half-mastery) and surface it for review.
// ============================================================================

const MASTERY_CONFIG = {
  RECENT_WINDOW: 10,
  CONFIDENCE_FLOOR: 8,
  FRESHNESS_HALFLIFE_DAYS: 14,
  WEAK_THRESHOLD: 0.7,   // mastery below this = "weak"
  STRONG_THRESHOLD: 0.85, // mastery at or above = "strong" (mastered)
};

// Gather every history entry across quizBankState, annotated with the question
// metadata. Returns a flat list sorted oldest→newest.
function collectAttempts(quizBankState, questionsList) {
  const byId = {};
  for (const q of questionsList) byId[q.id] = q;
  const attempts = [];
  for (const [qId, item] of Object.entries(quizBankState || {})) {
    const q = byId[qId];
    if (!q) continue; // question was removed/renamed
    for (const h of (item.history || [])) {
      // Only entries with a boolean `correct` came from scenario quizzes.
      // Legacy flashcard review entries don't have `correct` and are skipped.
      if (typeof h.correct !== 'boolean') continue;
      attempts.push({
        qId,
        courseId: q.courseId,
        category: q.category,
        difficulty: q.difficulty,
        correct: h.correct,
        date: h.date,
      });
    }
  }
  attempts.sort((a, b) => new Date(a.date) - new Date(b.date));
  return attempts;
}

// Exponential decay by days since last seen. 1.0 at 0 days, 0.5 at HALFLIFE.
function freshnessFactor(lastSeenISO) {
  if (!lastSeenISO) return 0;
  const days = (Date.now() - new Date(lastSeenISO).getTime()) / (1000 * 60 * 60 * 24);
  if (days < 0) return 1;
  return Math.pow(0.5, days / MASTERY_CONFIG.FRESHNESS_HALFLIFE_DAYS);
}

// Per-category mastery for a given course. Unseen categories get
// mastery=0, confidence=0 (distinct from "seen and failing").
function computeCategoryMastery(quizBankState, courseId) {
  const courseQuestions = getQuizzesForCourse(courseId);
  const attempts = collectAttempts(quizBankState, courseQuestions)
    .filter(a => a.courseId === courseId);

  // Group by category
  const byCategory = {};
  for (const a of attempts) {
    if (!byCategory[a.category]) byCategory[a.category] = [];
    byCategory[a.category].push(a);
  }

  // Which categories even appear in this course's question bank?
  const availableCategories = new Set(courseQuestions.map(q => q.category));

  const result = {};
  for (const cat of availableCategories) {
    const catAttempts = byCategory[cat] || [];
    if (catAttempts.length === 0) {
      result[cat] = {
        category: cat,
        attempts: 0,
        recentAttempts: 0,
        accuracy: 0,
        freshness: 0,
        confidence: 0,
        mastery: 0,
        lastSeen: null,
        status: 'unseen', // 'unseen' | 'learning' | 'weak' | 'good' | 'strong'
      };
      continue;
    }

    // Recent window — last N attempts for this category
    const recent = catAttempts.slice(-MASTERY_CONFIG.RECENT_WINDOW);
    const correctCount = recent.filter(a => a.correct).length;
    const accuracy = correctCount / recent.length;
    const lastSeen = catAttempts[catAttempts.length - 1].date;
    const freshness = freshnessFactor(lastSeen);

    // Confidence: how much we trust this score (0..1). Below the floor, we
    // treat the category as "learning" rather than weak/strong.
    const confidence = Math.min(1, catAttempts.length / MASTERY_CONFIG.CONFIDENCE_FLOOR);

    // Mastery is the product: accuracy × freshness × confidence. All three
    // must be high to call a category "mastered".
    const mastery = accuracy * freshness * confidence;

    // Status classification
    let status;
    if (confidence < 0.5) {
      status = 'learning';
    } else if (mastery >= MASTERY_CONFIG.STRONG_THRESHOLD) {
      status = 'strong';
    } else if (mastery < MASTERY_CONFIG.WEAK_THRESHOLD) {
      status = 'weak';
    } else {
      status = 'good';
    }

    result[cat] = {
      category: cat,
      attempts: catAttempts.length,
      recentAttempts: recent.length,
      accuracy,
      freshness,
      confidence,
      mastery,
      lastSeen,
      status,
    };
  }

  return result;
}

// Overall course readiness (0-100). Combines:
//   • Coverage: fraction of categories with confidence >= 0.5
//   • Accuracy: mean accuracy across covered categories
//   • Freshness: mean freshness across covered categories
// If nothing has been attempted, returns 0 with reason 'no-data'.
function computeReadinessForCourse(quizBankState, courseId) {
  const mastery = computeCategoryMastery(quizBankState, courseId);
  const cats = Object.values(mastery);
  const total = cats.length;
  const coveredCats = cats.filter(c => c.confidence >= 0.5);
  const totalAttempts = cats.reduce((a, c) => a + c.attempts, 0);

  if (totalAttempts === 0) {
    return { score: 0, total, covered: 0, attempts: 0, reason: 'no-data', mastery };
  }

  const coverageFrac = total > 0 ? coveredCats.length / total : 0;
  const avgAccuracy = coveredCats.length > 0
    ? coveredCats.reduce((a, c) => a + c.accuracy, 0) / coveredCats.length
    : 0;
  const avgFreshness = coveredCats.length > 0
    ? coveredCats.reduce((a, c) => a + c.freshness, 0) / coveredCats.length
    : 0;

  // Combined score: coverage matters most (you can't be ready if you haven't
  // seen the category), then accuracy, then freshness.
  const score = Math.round(100 * (
    0.45 * coverageFrac +
    0.40 * avgAccuracy +
    0.15 * avgFreshness
  ));

  return {
    score,
    total,
    covered: coveredCats.length,
    attempts: totalAttempts,
    avgAccuracy,
    avgFreshness,
    coverage: coverageFrac,
    reason: totalAttempts < 5 ? 'too-few' : 'ok',
    mastery,
  };
}

// Sorted list of weakest categories for a course. Used by the weak-spots
// quiz builder and the Focus-view chip.
function getWeakestCategories(quizBankState, courseId, limit = 3) {
  const mastery = computeCategoryMastery(quizBankState, courseId);
  return Object.values(mastery)
    .filter(c => c.attempts > 0 && c.status !== 'strong') // skip mastered
    .sort((a, b) => {
      // Primary: confidence × (1 - accuracy) — prefer categories we're confident
      // are weak (rather than categories with 2 flukes).
      const weightA = a.confidence * (1 - a.accuracy);
      const weightB = b.confidence * (1 - b.accuracy);
      if (weightA !== weightB) return weightB - weightA;
      // Tiebreak: oldest lastSeen first (prioritize stale knowledge)
      return new Date(a.lastSeen) - new Date(b.lastSeen);
    })
    .slice(0, limit);
}

// Build a weighted quiz pool. Phase 3 weak-spots mode composition:
//   60% — questions from weakest 2-3 categories (recent accuracy < WEAK_THRESHOLD)
//   25% — questions due today (forgotten items returning)
//   15% — fresh / unseen questions (prevent staleness, add coverage)
// Everything is drawn from the authored QUIZ_BANK scoped to the course.
// If there aren't enough questions in a bucket, we backfill from the next.
function buildWeakSpotsPool(quizBankState, courseId, targetCount) {
  const allCourseQs = getQuizzesForCourse(courseId);
  if (allCourseQs.length === 0) return [];

  const weakestCats = getWeakestCategories(quizBankState, courseId, 3);
  const weakCatIds = new Set(weakestCats.map(c => c.category));
  const todayMs = startOfDay(new Date()).getTime();

  // Classify each question
  const weakBucket = [];
  const dueBucket = [];
  const freshBucket = [];
  const otherBucket = [];
  for (const q of allCourseQs) {
    const state = quizBankState[q.id];
    const isDue = !state || (!state.retired && new Date(state.nextDue).getTime() <= todayMs);
    const isFresh = !state;

    if (weakCatIds.has(q.category)) {
      weakBucket.push(q);
    } else if (isDue && !isFresh) {
      dueBucket.push(q);
    } else if (isFresh) {
      freshBucket.push(q);
    } else {
      otherBucket.push(q);
    }
  }

  // Shuffle each bucket
  const shuffle = (arr) => {
    const out = [...arr];
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  };
  const weakShuf = shuffle(weakBucket);
  const dueShuf = shuffle(dueBucket);
  const freshShuf = shuffle(freshBucket);
  const otherShuf = shuffle(otherBucket);

  // Allocate with backfill
  const wantWeak = Math.round(targetCount * 0.60);
  const wantDue = Math.round(targetCount * 0.25);
  const wantFresh = targetCount - wantWeak - wantDue; // 15%

  const picked = new Set();
  const result = [];

  function drainInto(bucket, n, reason) {
    for (const q of bucket) {
      if (result.length >= targetCount) return;
      if (picked.has(q.id)) continue;
      picked.add(q.id);
      result.push({ ...q, _pickReason: reason });
      if (--n === 0) return;
    }
  }

  drainInto(weakShuf, wantWeak, 'weak');
  drainInto(dueShuf, wantDue, 'due');
  drainInto(freshShuf, wantFresh, 'fresh');

  // Backfill — draw from remaining buckets in priority order
  if (result.length < targetCount) drainInto(weakShuf, targetCount - result.length, 'weak');
  if (result.length < targetCount) drainInto(dueShuf, targetCount - result.length, 'due');
  if (result.length < targetCount) drainInto(freshShuf, targetCount - result.length, 'fresh');
  if (result.length < targetCount) drainInto(otherShuf, targetCount - result.length, 'other');

  return result;
}

// For the Focus-view nudge chip. Returns null if we don't have enough data
// (hidden state) or a { category, accuracy, recentCount, label } object.
function getFocusChipData(quizBankState, courseId) {
  const mastery = computeCategoryMastery(quizBankState, courseId);
  const weakest = Object.values(mastery)
    .filter(c => c.confidence >= 0.5 && c.status === 'weak')
    .sort((a, b) => a.mastery - b.mastery);
  if (weakest.length === 0) return null;
  const top = weakest[0];
  const cat = AWS_CATEGORIES.find(c => c.id === top.category);
  return {
    category: top.category,
    label: cat?.label || top.category,
    accuracy: top.accuracy,
    recentCount: top.recentAttempts,
    totalAttempts: top.attempts,
  };
}

// ── LEECH DETECTION ─────────────────────────────────────────────────────────
// A "leech" is a question you keep getting wrong. Following Anki's convention
// we flag a question as a leech after LEECH_FAIL_THRESHOLD wrong answers across
// its history. Leeches surface in Browse mode with a red badge and offer a
// "reset" action (clears interval/history so the question is treated as fresh).
const LEECH_FAIL_THRESHOLD = 4;

function isLeech(item) {
  if (!item || !item.history) return false;
  const wrongCount = item.history.filter(h => h.correct === false).length;
  return wrongCount >= LEECH_FAIL_THRESHOLD;
}

function getLeeches(quizBankState, courseId) {
  const result = [];
  const courseQs = getQuizzesForCourse(courseId);
  for (const q of courseQs) {
    const item = quizBankState[q.id];
    if (!item) continue;
    if (!isLeech(item)) continue;
    const wrongCount = item.history.filter(h => h.correct === false).length;
    const correctCount = item.history.filter(h => h.correct === true).length;
    result.push({
      question: q,
      wrongCount,
      correctCount,
      totalAttempts: wrongCount + correctCount,
      lastAttempt: item.history[item.history.length - 1]?.date,
    });
  }
  // Most-failed first, then most-recent
  result.sort((a, b) => {
    if (b.wrongCount !== a.wrongCount) return b.wrongCount - a.wrongCount;
    return new Date(b.lastAttempt) - new Date(a.lastAttempt);
  });
  return result;
}

// ── ROLLING ACCURACY (for the sparkline) ───────────────────────────────────
// Returns an array of { day: 'YYYY-MM-DD', attempts, correct, accuracy } for
// the last N days. Days with no attempts have attempts=0 and accuracy=null so
// the sparkline can draw a gap rather than a misleading 0%.
function getRollingAccuracy(quizBankState, courseId, days = 14) {
  const courseQs = getQuizzesForCourse(courseId);
  const attempts = collectAttempts(quizBankState, courseQs)
    .filter(a => a.courseId === courseId);

  // Bucket by day (YYYY-MM-DD in local time)
  const byDay = {};
  for (const a of attempts) {
    const d = new Date(a.date);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (!byDay[key]) byDay[key] = { attempts: 0, correct: 0 };
    byDay[key].attempts++;
    if (a.correct) byDay[key].correct++;
  }

  // Emit the last `days` days ending today (inclusive), chronological order
  const today = startOfDay(new Date());
  const out = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const bucket = byDay[key];
    out.push({
      day: key,
      attempts: bucket?.attempts || 0,
      correct: bucket?.correct || 0,
      accuracy: bucket ? bucket.correct / bucket.attempts : null,
    });
  }
  return out;
}

    migration:   'bg-orange-500/15 text-orange-300 border-orange-500/30',
    finance:     'bg-yellow-500/15 text-yellow-300 border-yellow-500/30',
  };
  return map[cat] || 'bg-ink-700/40 text-ink-300 border-ink-600';
}

// FlashcardsView (main container)
// ============================================================================
function FlashcardsView({ flashcardState, setFlashcardState, quizBankState, setQuizBankState, selectedCourseId, pendingIntent, onIntentConsumed }) {
  const [mode, setMode] = React.useState('browse'); // browse | study | match | quiz | scenarios
  const [examFilter, setExamFilter] = React.useState(selectedCourseId || 'all');
  const [categoryFilter, setCategoryFilter] = React.useState('all');
  const [searchQuery, setSearchQuery] = React.useState('');
  // Scenario-quiz initial source, driven by the Focus-view weak-spot chip.
  // Cleared after ScenarioQuiz consumes it.
  const [scenarioInitialSource, setScenarioInitialSource] = React.useState(null);

  // Scenario-quiz pool, scoped to the currently-selected course.
  const scenarioQuestions = React.useMemo(
    () => getQuizzesForCourse(selectedCourseId || DEFAULT_COURSE_ID),
    [selectedCourseId]
  );

  // Honor a pending intent from the Focus-view chip: jump to the right tab
  // and prime the scenario quiz with the requested source mode. Runs once
  // per intent, then signals the parent to clear it.
  React.useEffect(() => {
    if (!pendingIntent) return;
    if (pendingIntent.mode) setMode(pendingIntent.mode);
    if (pendingIntent.source) setScenarioInitialSource(pendingIntent.source);
    onIntentConsumed && onIntentConsumed();
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [pendingIntent]);

  const filteredCards = React.useMemo(() => {
    return FLASHCARDS.filter(c => {
      if (examFilter !== 'all' && !c.examTags.includes(examFilter)) return false;
      if (categoryFilter !== 'all' && c.category !== categoryFilter) return false;
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        if (!c.service.toLowerCase().includes(q)
          && !c.description.toLowerCase().includes(q)
          && !(c.shortName || '').toLowerCase().includes(q)) return false;
      }
      return true;
    });
  }, [examFilter, categoryFilter, searchQuery]);

  const due = React.useMemo(
    () => getDueFlashcards(filteredCards, flashcardState),
    [filteredCards, flashcardState]
  );

  const seenCount = filteredCards.filter(c => flashcardState[c.id]).length;
  const masteredCount = filteredCards.filter(c => {
    const item = flashcardState[c.id];
    return item && item.interval >= 14;
  }).length;

  return (
    <div className="space-y-6">
      {/* Header */}
      <div className="flex items-baseline justify-between flex-wrap gap-3">
        <div>
          <h2 className="display-italic text-2xl text-ink-50">Flashcards</h2>
          <p className="text-sm text-ink-400 mt-1">
            {FLASHCARDS.length} services across all 12 AWS exams · sourced from official exam guides
          </p>
          <div className="flex flex-wrap gap-3 mt-2 text-[10px]">
            <span className="text-ember-300">★ Residency (SOA · DVA · DEA)</span>
            <span className="text-violet-300">◆ Stretch (SAP)</span>
            <span className="text-emerald-300">✓ Earned (CLF · AIF · SAA · MLA)</span>
            <span className="text-ink-400">· Coverage (other pros + specialties)</span>
          </div>
        </div>
        <div className="flex gap-2 text-xs">
          <span className="px-2.5 py-1 rounded-full bg-ink-800/60 border border-white/5 text-ink-200">
            {seenCount}/{filteredCards.length} seen
          </span>
          <span className="px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-300">
            {masteredCount} mastered
          </span>
          {due.length > 0 && (
            <span className="px-2.5 py-1 rounded-full bg-ember-500/15 border border-ember-500/30 text-ember-300">
              {due.length} due
            </span>
          )}
        </div>
      </div>

      {/* Mode tabs */}
      <div className="flex gap-1 p-1 rounded-full bg-ink-800/60 border border-white/5 w-fit flex-wrap">
        {[
          { id: 'browse',    label: 'Browse' },
          { id: 'study',     label: due.length > 0 ? `Study · ${due.length} due` : 'Study' },
          { id: 'match',     label: 'Match game' },
          { id: 'quiz',      label: 'Quick quiz' },
          { id: 'scenarios', label: scenarioQuestions.length > 0 ? `Scenarios · ${scenarioQuestions.length}` : 'Scenarios' },
        ].map(m => (
          <button
            key={m.id}
            onClick={() => setMode(m.id)}
            className={`px-4 py-1.5 text-sm font-medium rounded-full transition-all ${
              mode === m.id ? 'bg-ink-50 text-ink-900' : 'text-ink-200 hover:text-ink-50'
            }`}
          >{m.label}</button>
        ))}
      </div>

      {/* Filters (hidden for scenario mode — scenarios have their own course scope) */}
      {mode !== 'scenarios' && (
        <FlashcardFilters
          examFilter={examFilter} setExamFilter={setExamFilter}
          categoryFilter={categoryFilter} setCategoryFilter={setCategoryFilter}
          searchQuery={searchQuery} setSearchQuery={setSearchQuery}
          resultCount={filteredCards.length}
        />
      )}

      {/* Mode renderers */}
      {mode === 'browse' && (
        <FlashcardBrowse cards={filteredCards} flashcardState={flashcardState} />
      )}
      {mode === 'study' && (
        <FlashcardStudy
          cards={filteredCards}
          flashcardState={flashcardState}
          setFlashcardState={setFlashcardState}
        />
      )}
      {mode === 'match' && (
        <FlashcardMatchGame cards={filteredCards} />
      )}
      {mode === 'quiz' && (
        <FlashcardQuizMode cards={filteredCards} />
      )}
      {mode === 'scenarios' && (
        <ScenarioQuiz
          questions={scenarioQuestions}
          courseId={selectedCourseId || DEFAULT_COURSE_ID}
          quizBankState={quizBankState || {}}
          setQuizBankState={setQuizBankState}
          initialSource={scenarioInitialSource}
          onInitialSourceConsumed={() => setScenarioInitialSource(null)}
        />
      )}
    </div>
  );
}
