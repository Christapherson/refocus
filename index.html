// ============================================================================
// Study mode
// ============================================================================
function FlashcardStudy({ cards, flashcardState, setFlashcardState }) {
  const [order, setOrder] = React.useState([]);
  const [idx, setIdx] = React.useState(0);
  const [revealed, setRevealed] = React.useState(false);
  const [sessionGrades, setSessionGrades] = React.useState([]);
  const [done, setDone] = React.useState(false);

  // Build study queue: prioritize due, then unseen, then in-progress
  React.useEffect(() => {
    const todayMs = startOfDay(new Date()).getTime();
    const due = [];
    const unseen = [];
    const otherSeen = [];
    cards.forEach(c => {
      const item = flashcardState[c.id];
      if (!item) {
        unseen.push(c);
      } else if (item.retired) {
        // skip retired
      } else if (new Date(item.nextDue).getTime() <= todayMs) {
        due.push(c);
      } else {
        otherSeen.push(c);
      }
    });
    // Shuffle each bucket
    const shuffle = arr => {
      const out = [...arr];
      for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
      }
      return out;
    };
    const queue = [...shuffle(due), ...shuffle(unseen), ...shuffle(otherSeen)].slice(0, 20);
    setOrder(queue);
    setIdx(0);
    setRevealed(false);
    setSessionGrades([]);
    setDone(false);
  }, [cards, flashcardState]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (done) return;
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea') return;
      if (e.key === ' ' && !revealed) {
        e.preventDefault();
        setRevealed(true);
      } else if (revealed) {
        if (e.key === '1') { e.preventDefault(); grade('forgot'); }
        else if (e.key === '2') { e.preventDefault(); grade('hazy'); }
        else if (e.key === '3') { e.preventDefault(); grade('solid'); }
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [done, revealed]);

  if (cards.length === 0) {
    return <div className="text-center py-12 text-ink-400">No cards match your filters.</div>;
  }

  if (order.length === 0) {
    return <div className="text-center py-12 text-ink-400">Building queue\u2026</div>;
  }

  if (done) {
    const counts = sessionGrades.reduce((acc, g) => { acc[g] = (acc[g] || 0) + 1; return acc; }, {});
    return (
      <div className="text-center py-12 space-y-4">
        <div className="text-2xl display-italic text-ink-50">Round complete</div>
        <div className="flex justify-center gap-6 text-sm">
          <span className="text-emerald-400">{counts.solid || 0} solid</span>
          <span className="text-amber-400">{counts.hazy || 0} hazy</span>
          <span className="text-rose-400">{counts.forgot || 0} forgot</span>
        </div>
        <button
          onClick={() => { setIdx(0); setRevealed(false); setSessionGrades([]); setDone(false); }}
          className="px-5 py-2 rounded-full bg-ember-500 text-ink-900 font-semibold hover:bg-ember-400"
        >Another round</button>
      </div>
    );
  }

  const current = order[idx];
  if (!current) return null;

  function grade(g) {
    const item = flashcardState[current.id] || initialFlashcardItem();
    const updated = gradeReviewItem(item, g);
    setFlashcardState(prev => ({ ...prev, [current.id]: updated }));
    setSessionGrades(s => [...s, g]);
    if (idx + 1 >= order.length) {
      setDone(true);
    } else {
      setIdx(idx + 1);
      setRevealed(false);
    }
  }

  const progress = ((idx + (revealed ? 0.5 : 0)) / order.length) * 100;

  return (
    <div className="max-w-2xl mx-auto space-y-4">
      {/* Progress */}
      <div className="flex items-center gap-3">
        <div className="flex-1 h-1 bg-ink-700 rounded-full overflow-hidden">
          <div className="h-full bg-ember-500 transition-all" style={{ width: `${progress}%` }} />
        </div>
        <span className="text-xs text-ink-400">{idx + 1} / {order.length}</span>
      </div>

      {/* Card */}
      <div
        onClick={() => !revealed && setRevealed(true)}
        className={`rounded-3xl p-8 border transition-all min-h-[20rem] ${
          revealed
            ? 'bg-ink-800/60 border-ember-500/30'
            : 'bg-ink-800/40 border-white/10 cursor-pointer hover:border-white/30'
        }`}
      >
        {/* Top metadata */}
        <div className="flex items-start justify-between gap-3 mb-6">
          <div className="flex flex-wrap gap-1.5">
            <span className={`text-[10px] px-2 py-0.5 rounded-full border ${categoryColorClasses(current.category)}`}>
              {FLASHCARD_CATEGORIES.find(c => c.id === current.category)?.label}
            </span>
            {current.examTags.map(t => (
              <span key={t} className="text-[9px] uppercase tracking-wider px-1.5 py-0.5 rounded bg-ink-700/60 text-ink-300 border border-white/5">
                {EXAM_INFO[t]?.code}
              </span>
            ))}
          </div>
          {flashcardState[current.id] && (
            <span className="text-[10px] text-ink-400">
              streak {flashcardState[current.id].interval}d
            </span>
          )}
        </div>

        {/* Service name (front) */}
        <div className="text-center mb-6">
          <div className="display-italic text-3xl md:text-4xl text-ink-50 leading-tight">{current.service}</div>
        </div>

        {/* Back content */}
        {revealed ? (
          <div className="space-y-4 pt-4 border-t border-white/5">
            <p className="text-base text-ink-100 leading-relaxed">{current.description}</p>
            {current.keyFacts && (
              <ul className="text-sm text-ink-200 space-y-2">
                {current.keyFacts.map((f, i) => (
                  <li key={i} className="flex gap-2">
                    <span className="text-ember-500 shrink-0">›</span>
                    <span>{f}</span>
                  </li>
                ))}
              </ul>
            )}
            <a
              href={current.sourceUrl}
              target="_blank"
              rel="noopener noreferrer"
              className="inline-flex items-center gap-1 text-xs text-ink-400 hover:text-ember-400"
            >Verify on AWS docs ↗</a>
          </div>
        ) : (
          <div className="text-center text-sm text-ink-500">
            Click or press <kbd className="px-1.5 py-0.5 text-[11px] rounded bg-ink-700/80 text-ink-200 border border-white/10">Space</kbd> to reveal
          </div>
        )}
      </div>

      {/* Grade buttons */}
      {revealed && (
        <div className="grid grid-cols-3 gap-2">
          <button
            onClick={() => grade('forgot')}
            className="px-3 py-2.5 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 border border-rose-500/30 text-rose-300 text-sm font-medium transition-all"
          >
            Forgot <span className="text-[10px] text-rose-400/70 ml-1">1</span>
          </button>
          <button
            onClick={() => grade('hazy')}
            className="px-3 py-2.5 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/30 text-amber-300 text-sm font-medium transition-all"
          >
            Hazy <span className="text-[10px] text-amber-400/70 ml-1">2</span>
          </button>
          <button
            onClick={() => grade('solid')}
            className="px-3 py-2.5 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/30 text-emerald-300 text-sm font-medium transition-all"
          >
            Solid <span className="text-[10px] text-emerald-400/70 ml-1">3</span>
          </button>
        </div>
      )}
    </div>
  );
}

// ============================================================================
// Match game
// ============================================================================
function FlashcardMatchGame({ cards }) {
  const [round, setRound] = React.useState([]);
  const [serviceOrder, setServiceOrder] = React.useState([]);
  const [descOrder, setDescOrder] = React.useState([]);
  const [selectedSvc, setSelectedSvc] = React.useState(null);
  const [selectedDesc, setSelectedDesc] = React.useState(null);
  const [matched, setMatched] = React.useState({}); // cardId -> true
  const [wrong, setWrong] = React.useState(null); // {svc, desc}
  const [startTime, setStartTime] = React.useState(null);
  const [endTime, setEndTime] = React.useState(null);
  const [misses, setMisses] = React.useState(0);

  const buildRound = React.useCallback(() => {
    if (cards.length < 4) return;
    const shuffle = arr => {
      const out = [...arr];
      for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
      }
      return out;
    };
    const picked = shuffle(cards).slice(0, Math.min(6, cards.length));
    setRound(picked);
    setServiceOrder(shuffle(picked).map(c => c.id));
    setDescOrder(shuffle(picked).map(c => c.id));
    setMatched({});
    setSelectedSvc(null);
    setSelectedDesc(null);
    setWrong(null);
    setStartTime(Date.now());
    setEndTime(null);
    setMisses(0);
  }, [cards]);

  React.useEffect(() => { buildRound(); }, [buildRound]);

  const allMatched = round.length > 0 && round.every(c => matched[c.id]);
  React.useEffect(() => {
    if (allMatched && !endTime) setEndTime(Date.now());
  }, [allMatched, endTime]);

  if (cards.length < 4) {
    return (
      <div className="text-center py-12 text-ink-400">
        Match game needs at least 4 cards. Loosen your filters.
      </div>
    );
  }

  function tryPair(svcId, descId) {
    if (svcId === descId) {
      setMatched(m => ({ ...m, [svcId]: true }));
      setSelectedSvc(null);
      setSelectedDesc(null);
    } else {
      setWrong({ svc: svcId, desc: descId });
      setMisses(n => n + 1);
      setTimeout(() => {
        setWrong(null);
        setSelectedSvc(null);
        setSelectedDesc(null);
      }, 700);
    }
  }

  function pickService(id) {
    if (matched[id] || wrong) return;
    if (selectedSvc === id) { setSelectedSvc(null); return; }
    if (selectedDesc) {
      tryPair(id, selectedDesc);
    } else {
      setSelectedSvc(id);
    }
  }
  function pickDesc(id) {
    if (matched[id] || wrong) return;
    if (selectedDesc === id) { setSelectedDesc(null); return; }
    if (selectedSvc) {
      tryPair(selectedSvc, id);
    } else {
      setSelectedDesc(id);
    }
  }

  const elapsed = endTime ? Math.round((endTime - startTime) / 1000) : null;
  const accuracy = round.length > 0
    ? Math.round((round.length / (round.length + misses)) * 100)
    : 0;

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div className="text-sm text-ink-300">
          Match each service to its description. {round.length - Object.keys(matched).length} remaining.
          {misses > 0 && <span className="text-rose-400 ml-2">· {misses} {misses === 1 ? 'miss' : 'misses'}</span>}
        </div>
        <button
          onClick={buildRound}
          className="px-3 py-1.5 text-xs rounded-full bg-ink-800/60 hover:bg-ink-800 border border-white/5 hover:border-white/15 text-ink-200"
        >Shuffle new round</button>
      </div>

      {allMatched && (
        <div className="rounded-2xl p-5 bg-emerald-500/10 border border-emerald-500/30 text-center">
          <div className="display-italic text-2xl text-emerald-300 mb-1">Round cleared</div>
          <div className="text-sm text-emerald-200">
            {elapsed}s · {accuracy}% accuracy · {round.length} pairs
          </div>
          <button
            onClick={buildRound}
            className="mt-3 px-4 py-1.5 text-sm rounded-full bg-emerald-500 hover:bg-emerald-400 text-ink-900 font-medium"
          >Play again</button>
        </div>
      )}

      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {/* Services column */}
        <div className="space-y-2">
          <div className="small-caps text-ink-400 mb-2">Services</div>
          {serviceOrder.map(id => {
            const card = round.find(c => c.id === id);
            if (!card) return null;
            const isMatched = matched[id];
            const isSelected = selectedSvc === id;
            const isWrong = wrong?.svc === id;
            return (
              <button
                key={id}
                onClick={() => pickService(id)}
                disabled={isMatched}
                className={`w-full text-left px-4 py-3 rounded-xl border transition-all ${
                  isMatched
                    ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300 opacity-60 cursor-default'
                    : isWrong
                      ? 'bg-rose-500/15 border-rose-500/40 text-rose-200'
                      : isSelected
                        ? 'bg-ember-500/20 border-ember-500/50 text-ink-50'
                        : 'bg-ink-800/40 border-white/5 hover:border-white/20 text-ink-100'
                }`}
              >
                <div className="font-semibold">{card.service}</div>
                <span className={`text-[9px] uppercase tracking-wider px-1.5 py-0.5 rounded mt-1 inline-block ${categoryColorClasses(card.category)} border`}>
                  {FLASHCARD_CATEGORIES.find(c => c.id === card.category)?.label}
                </span>
              </button>
            );
          })}
        </div>

        {/* Descriptions column */}
        <div className="space-y-2">
          <div className="small-caps text-ink-400 mb-2">Descriptions</div>
          {descOrder.map(id => {
            const card = round.find(c => c.id === id);
            if (!card) return null;
            const isMatched = matched[id];
            const isSelected = selectedDesc === id;
            const isWrong = wrong?.desc === id;
            return (
              <button
                key={id}
                onClick={() => pickDesc(id)}
                disabled={isMatched}
                className={`w-full text-left px-4 py-3 rounded-xl border transition-all ${
                  isMatched
                    ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-200 opacity-60 cursor-default'
                    : isWrong
                      ? 'bg-rose-500/15 border-rose-500/40 text-rose-200'
                      : isSelected
                        ? 'bg-ember-500/20 border-ember-500/50 text-ink-50'
                        : 'bg-ink-800/40 border-white/5 hover:border-white/20 text-ink-100'
                }`}
              >
                <p className="text-sm leading-snug">{card.description}</p>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ============================================================================
// Quiz mode — multiple-choice generated from flashcard data.
// Three modes: Lightning (10q), Standard (25q), Deep (50q).
// Question types are auto-picked and balanced: service→desc, desc→service,
// keyFact→service. Distractors are same-category whenever possible so the
// test is meaningful, not trivial. Misses show the correct answer + source.
// ============================================================================
function FlashcardQuizMode({ cards }) {
  const [phase, setPhase] = React.useState('config'); // config | running | results
  const [length, setLength] = React.useState(10);
  const [questions, setQuestions] = React.useState([]);
  const [idx, setIdx] = React.useState(0);
  const [answers, setAnswers] = React.useState([]); // { qIdx, chosenIdx, correct }
  const [startedAt, setStartedAt] = React.useState(null);
  const [endedAt, setEndedAt] = React.useState(null);
  const [reviewMisses, setReviewMisses] = React.useState(false);

  const shuffle = (arr) => {
    const out = [...arr];
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  };

  function buildQuestions(targetCount) {
    if (cards.length < 4) return [];
    const pool = shuffle(cards).slice(0, targetCount);
    const qs = pool.map((card) => {
      const typeRoll = Math.random();
      // 50% service→desc, 30% desc→service, 20% keyFact→service (if facts exist)
      const hasFacts = card.keyFacts && card.keyFacts.length > 0;
      let qType;
      if (typeRoll < 0.5) qType = 'svc-to-desc';
      else if (typeRoll < 0.8 || !hasFacts) qType = 'desc-to-svc';
      else qType = 'fact-to-svc';

      // Distractors — prefer same category, fall back to any
      const sameCat = cards.filter(c => c.id !== card.id && c.category === card.category);
      const otherCat = cards.filter(c => c.id !== card.id && c.category !== card.category);
      const distractorPool = sameCat.length >= 3 ? sameCat : [...sameCat, ...otherCat];
      const distractors = shuffle(distractorPool).slice(0, 3);

      let stem, options, correctOptionIdx;
      if (qType === 'svc-to-desc') {
        stem = `Which description best fits ${card.service}?`;
        const opts = shuffle([card, ...distractors]);
        correctOptionIdx = opts.findIndex(o => o.id === card.id);
        options = opts.map(o => o.description);
      } else if (qType === 'desc-to-svc') {
        stem = `Which AWS service is described below?\n"${card.description}"`;
        const opts = shuffle([card, ...distractors]);
        correctOptionIdx = opts.findIndex(o => o.id === card.id);
        options = opts.map(o => o.service);
      } else {
        const fact = card.keyFacts[Math.floor(Math.random() * card.keyFacts.length)];
        stem = `Which AWS service matches this fact?\n"${fact}"`;
        const opts = shuffle([card, ...distractors]);
        correctOptionIdx = opts.findIndex(o => o.id === card.id);
        options = opts.map(o => o.service);
      }

      return {
        card,
        stem,
        options,
        correctOptionIdx,
        qType,
      };
    });
    return qs;
  }

  function startQuiz(n) {
    const qs = buildQuestions(n);
    if (qs.length === 0) return;
    setQuestions(qs);
    setLength(n);
    setIdx(0);
    setAnswers([]);
    setStartedAt(Date.now());
    setEndedAt(null);
    setReviewMisses(false);
    setPhase('running');
  }

  function chooseOption(optionIdx) {
    const q = questions[idx];
    const correct = optionIdx === q.correctOptionIdx;
    const nextAnswers = [...answers, { qIdx: idx, chosenIdx: optionIdx, correct }];
    setAnswers(nextAnswers);

    // Small delay to let user see the feedback, then advance
    setTimeout(() => {
      if (idx + 1 >= questions.length) {
        setEndedAt(Date.now());
        setPhase('results');
      } else {
        setIdx(idx + 1);
      }
    }, 900);
  }

  if (cards.length < 4) {
    return (
      <div className="text-center py-12 text-ink-400">
        Quiz mode needs at least 4 cards. Loosen your filters.
      </div>
    );
  }

  // ── Config screen ─────────────────────────────────────────────────────────
  if (phase === 'config') {
    return (
      <div className="max-w-2xl mx-auto space-y-5">
        <div className="rounded-2xl p-6 bg-ink-800/40 border border-white/5 space-y-4">
          <div>
            <div className="display-italic text-2xl text-ink-50 mb-1">Quick Quiz</div>
            <p className="text-sm text-ink-400">
              Multiple-choice questions generated from your {cards.length} filtered cards.
              Pick a length to start. Distractors are same-category where possible — this isn't
              a gimme.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
            {[
              { n: 10, label: 'Lightning', sub: '~3 min', desc: 'Warmup or between-session review' },
              { n: 25, label: 'Standard',  sub: '~8 min', desc: 'Solid check on filter coverage' },
              { n: 50, label: 'Deep',      sub: '~15 min', desc: 'Pre-exam session readiness' },
            ].map(opt => (
              <button
                key={opt.n}
                onClick={() => startQuiz(opt.n)}
                disabled={cards.length < opt.n}
                className={`p-4 rounded-xl border text-left transition-all ${
                  cards.length < opt.n
                    ? 'bg-ink-800/20 border-white/5 text-ink-600 cursor-not-allowed'
                    : 'bg-ink-800/60 border-white/10 hover:border-ember-500/40 hover:bg-ink-800 text-ink-100'
                }`}
              >
                <div className="flex items-baseline justify-between gap-2">
                  <span className="display-italic text-xl">{opt.label}</span>
                  <span className="text-[10px] text-ink-400">{opt.sub}</span>
                </div>
                <div className="text-[11px] text-ink-400 mt-1">
                  {opt.n} questions
                </div>
                <div className="text-xs text-ink-300 mt-2">{opt.desc}</div>
                {cards.length < opt.n && (
                  <div className="text-[10px] text-rose-400 mt-2">
                    Need {opt.n} cards — have {cards.length}
                  </div>
                )}
              </button>
            ))}
          </div>

          <div className="text-[11px] text-ink-500 pt-3 border-t border-white/5 leading-relaxed">
            <strong className="text-ink-400">Note:</strong> this is a lightweight quiz for daily reinforcement —
            think "warm the service names in your head." For real exam readiness with 700+ scenario questions
            and calibrated difficulty, keep using Tutorials Dojo. This and TD do different jobs.
          </div>
        </div>
      </div>
    );
  }

  // ── Results screen ────────────────────────────────────────────────────────
  if (phase === 'results') {
    const correctCount = answers.filter(a => a.correct).length;
    const pct = Math.round((correctCount / answers.length) * 100);
    const elapsed = Math.round((endedAt - startedAt) / 1000);
    const mins = Math.floor(elapsed / 60);
    const secs = elapsed % 60;
    const misses = answers.filter(a => !a.correct).map(a => ({
      q: questions[a.qIdx],
      chosenIdx: a.chosenIdx,
    }));

    const scoreColor = pct >= 80 ? 'emerald' : pct >= 65 ? 'amber' : 'rose';

    return (
      <div className="max-w-3xl mx-auto space-y-4">
        <div className={`rounded-2xl p-6 bg-${scoreColor}-500/10 border border-${scoreColor}-500/30 text-center`}>
          <div className={`display-italic text-5xl text-${scoreColor}-300 mb-2`}>{pct}%</div>
          <div className={`text-sm text-${scoreColor}-200`}>
            {correctCount} / {answers.length} correct · {mins}m {secs}s
          </div>
        </div>

        <div className="flex flex-wrap gap-2 justify-center">
          <button
            onClick={() => startQuiz(length)}
            className="px-4 py-2 rounded-full bg-ember-500 text-ink-900 font-semibold hover:bg-ember-400"
          >Another round of {length}</button>
          <button
            onClick={() => setPhase('config')}
            className="px-4 py-2 rounded-full border border-white/10 hover:border-white/25 text-ink-100"
          >Change length</button>
          {misses.length > 0 && (
            <button
              onClick={() => setReviewMisses(!reviewMisses)}
              className="px-4 py-2 rounded-full border border-rose-500/30 bg-rose-500/10 hover:bg-rose-500/20 text-rose-200"
            >{reviewMisses ? 'Hide' : 'Review'} {misses.length} miss{misses.length === 1 ? '' : 'es'}</button>
          )}
        </div>

        {reviewMisses && misses.length > 0 && (
          <div className="space-y-3">
            {misses.map((m, i) => (
              <div key={i} className="rounded-2xl p-4 bg-ink-800/40 border border-rose-500/20 space-y-2">
                <div className="text-xs text-rose-400 mb-1 small-caps">Missed #{i+1}</div>
                <div className="text-sm text-ink-100 whitespace-pre-line">{m.q.stem}</div>
                <div className="flex flex-wrap gap-2 text-xs mt-2">
                  <span className="px-2 py-1 rounded bg-rose-500/15 border border-rose-500/30 text-rose-200">
                    You chose: {m.q.options[m.chosenIdx]}
                  </span>
                  <span className="px-2 py-1 rounded bg-emerald-500/15 border border-emerald-500/30 text-emerald-200">
                    Correct: {m.q.options[m.q.correctOptionIdx]}
                  </span>
                </div>
                <div className="pt-2 mt-2 border-t border-white/5 text-xs text-ink-300 leading-relaxed">
                  <strong className="text-ink-200">{m.q.card.service}:</strong> {m.q.card.description}
                  {' '}
                  <a
                    href={m.q.card.sourceUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="text-ember-400 hover:text-ember-300 ml-1"
                  >docs ↗</a>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  // ── Running quiz ──────────────────────────────────────────────────────────
  const q = questions[idx];
  const thisAnswer = answers.find(a => a.qIdx === idx);
  const answered = !!thisAnswer;

  return (
    <div className="max-w-2xl mx-auto space-y-4">
      {/* Progress */}
      <div className="flex items-center gap-3">
        <div className="flex-1 h-1 bg-ink-700 rounded-full overflow-hidden">
          <div
            className="h-full bg-ember-500 transition-all"
            style={{ width: `${((idx + (answered ? 1 : 0)) / questions.length) * 100}%` }}
          />
        </div>
        <span className="text-xs text-ink-400">{idx + 1} / {questions.length}</span>
        <button
          onClick={() => { if (confirm('Quit this quiz?')) setPhase('config'); }}
          className="text-xs text-ink-500 hover:text-ink-300"
          title="Quit"
        >✕</button>
      </div>

      {/* Stem */}
      <div className="rounded-2xl p-5 bg-ink-800/40 border border-white/5">
        <div className="flex flex-wrap gap-1.5 mb-3">
          <span className={`text-[10px] px-2 py-0.5 rounded-full border ${categoryColorClasses(q.card.category)}`}>
            {FLASHCARD_CATEGORIES.find(c => c.id === q.card.category)?.label}
          </span>
          {q.card.examTags.slice(0, 4).map(t => (
            <span key={t} className="text-[9px] uppercase tracking-wider px-1.5 py-0.5 rounded bg-ink-700/60 text-ink-300 border border-white/5">
              {EXAM_INFO[t]?.code}
            </span>
          ))}
          {q.card.examTags.length > 4 && (
            <span className="text-[9px] text-ink-500 px-1">+{q.card.examTags.length - 4}</span>
          )}
        </div>
        <div className="text-base text-ink-100 whitespace-pre-line leading-relaxed">{q.stem}</div>
      </div>

      {/* Options */}
      <div className="grid grid-cols-1 gap-2">
        {q.options.map((opt, i) => {
          const isChosen = answered && thisAnswer.chosenIdx === i;
          const isCorrectOpt = i === q.correctOptionIdx;
          let classes = 'bg-ink-800/40 border-white/5 hover:border-white/20 text-ink-100';
          if (answered) {
            if (isCorrectOpt) classes = 'bg-emerald-500/15 border-emerald-500/40 text-emerald-100';
            else if (isChosen && !isCorrectOpt) classes = 'bg-rose-500/15 border-rose-500/40 text-rose-100';
            else classes = 'bg-ink-800/20 border-white/5 text-ink-400';
          }
          return (
            <button
              key={i}
              onClick={() => !answered && chooseOption(i)}
              disabled={answered}
              className={`w-full text-left px-4 py-3 rounded-xl border transition-all ${classes}`}
            >
              <div className="flex items-start gap-3">
                <span className={`shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-xs font-semibold ${
                  answered && isCorrectOpt
                    ? 'bg-emerald-500 text-ink-900'
                    : answered && isChosen
                      ? 'bg-rose-500 text-ink-900'
                      : 'bg-ink-700 text-ink-300'
                }`}>
                  {String.fromCharCode(65 + i)}
                </span>
                <span className="text-sm leading-snug">{opt}</span>
              </div>
            </button>
          );
        })}
      </div>

      {/* Post-answer source link */}
      {answered && (
        <div className="text-center">
          <a
            href={q.card.sourceUrl}
            target="_blank"
            rel="noopener noreferrer"
            className="text-xs text-ink-400 hover:text-ember-400"
          >Verify {q.card.service} on AWS docs ↗</a>
        </div>
      )}
    </div>
  );
}

// ============================================================================
// ScenarioQuiz — Tutorials Dojo-style authored scenario questions
// ----------------------------------------------------------------------------
// Uses the same SR engine (gradeReviewItem) as flashcards and session reviews.
// Correct answer → 'solid' grade (doubles interval, caps at SR_MAX_INTERVAL).
// Wrong answer   → 'forgot' grade (resets to 1 day).
// Per-question history records { date, grade, correct, chosenIdx } so Phase 3
// can compute per-category mastery and build an adaptive "weak spots" set.
//
// Length presets: 10, 20, all. Source mode: all | due | weak (stubs — "weak"
// ranks by lowest mastery in recent history; "due" uses SR nextDue).
// ============================================================================

// Inline **bold** renderer — splits on ** markers and wraps alternating segments
// in <strong>. Safer than dangerouslySetInnerHTML; no HTML is ever parsed.
function RichText({ text, className }) {
  if (!text) return null;
  const parts = text.split(/\*\*(.+?)\*\*/g);
  return (
    <span className={className}>
      {parts.map((p, i) => i % 2 === 1
        ? <strong key={i} className="text-ink-50 font-semibold">{p}</strong>
        : <React.Fragment key={i}>{p}</React.Fragment>
      )}
    </span>
  );
}

// ── Sparkline — tiny 14-day accuracy trend ──────────────────────────────────
// Takes a series of { day, attempts, accuracy } points. Days with no attempts
// are rendered as a transparent gap (not a false 0%). A zero-data state shows
// a dim baseline so the layout doesn't jump when data arrives.
function Sparkline({ data, width = 140, height = 30, accentColor = 'rgb(245 158 11)' }) {
  if (!data || data.length === 0) return null;
  const n = data.length;
  const stepX = width / Math.max(1, n - 1);

  // Build a path string, breaking into segments where data is missing
  const segments = [];
  let current = [];
  data.forEach((d, i) => {
    if (d.accuracy === null) {
      if (current.length > 1) segments.push(current);
      current = [];
      return;
    }
    const x = i * stepX;
    const y = height - (d.accuracy * (height - 4)) - 2; // 2px padding top/bottom
    current.push([x, y]);
  });
  if (current.length > 1) segments.push(current);

  const hasAnyData = data.some(d => d.accuracy !== null);

  return (
    <svg width={width} height={height} className="inline-block" aria-label="14-day accuracy trend">
      {/* Baseline at 50% — a visual anchor for "passing/not passing" */}
      <line x1={0} y1={height/2} x2={width} y2={height/2}
            stroke="currentColor" strokeDasharray="2 3" strokeOpacity="0.15" />
      {/* Empty state — dim baseline stroke */}
      {!hasAnyData && (
        <line x1={0} y1={height - 2} x2={width} y2={height - 2}
              stroke="currentColor" strokeOpacity="0.2" strokeWidth="1" />
      )}
      {/* Segments of the actual trendline */}
      {segments.map((seg, si) => (
        <polyline
          key={si}
          points={seg.map(p => p.join(',')).join(' ')}
          fill="none"
          stroke={accentColor}
          strokeWidth="1.5"
          strokeLinecap="round"
          strokeLinejoin="round"
        />
      ))}
      {/* Dots on days with attempts */}
      {data.map((d, i) => {
        if (d.accuracy === null) return null;
        const x = i * stepX;
        const y = height - (d.accuracy * (height - 4)) - 2;
        return <circle key={i} cx={x} cy={y} r={1.5} fill={accentColor} />;
      })}
    </svg>
  );
}

function initialQuizBankItem() {
  return {
    interval: 1,
    nextDue: addDays(startOfDay(new Date()), 1).toISOString(),
    reviewCount: 0,
    history: [],
    retired: false,
    firstSeenAt: new Date().toISOString(),
  };
}

function ScenarioQuiz({ questions, courseId, quizBankState, setQuizBankState, initialSource, onInitialSourceConsumed }) {
  const [phase, setPhase] = React.useState('config'); // config | running | results
  const [length, setLength] = React.useState(10);
  const [source, setSource] = React.useState(initialSource || 'all'); // 'all' | 'due' | 'fresh' | 'weak'
  const [quizQs, setQuizQs] = React.useState([]);
  const [idx, setIdx] = React.useState(0);
  const [chosenIdx, setChosenIdx] = React.useState(null);
  const [answers, setAnswers] = React.useState([]); // { qId, chosenIdx, correct }
  const [startedAt, setStartedAt] = React.useState(null);
  const [endedAt, setEndedAt] = React.useState(null);

  // If we get a fresh initialSource prop (e.g., Focus-view chip → weak mode),
  // adopt it and clear the parent hint so subsequent changes from the user stick.
  React.useEffect(() => {
    if (initialSource && initialSource !== source) {
      setSource(initialSource);
      onInitialSourceConsumed && onInitialSourceConsumed();
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [initialSource]);
  const course = getCourse(courseId);

  // Shuffle helper
  function shuffle(arr) {
    const out = [...arr];
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }

  // Build the quiz question pool based on source + length
  function buildPool(sourceMode, targetCount) {
    const todayMs = startOfDay(new Date()).getTime();

    // Weak-spots mode delegates to the mastery engine — composes from weak
    // categories + due + fresh with 60/25/15 weighting and backfill.
    if (sourceMode === 'weak') {
      return buildWeakSpotsPool(quizBankState, courseId, targetCount);
    }

    let pool = [...questions];

    if (sourceMode === 'due') {
      pool = pool.filter(q => {
        const s = quizBankState[q.id];
        // Unseen questions count as due; seen questions due when nextDue <= today
        if (!s) return true;
        if (s.retired) return false;
        return new Date(s.nextDue).getTime() <= todayMs;
      });
    } else if (sourceMode === 'fresh') {
      // Unseen-first, then least-recently-seen
      pool.sort((a, b) => {
        const sa = quizBankState[a.id], sb = quizBankState[b.id];
        if (!sa && !sb) return 0;
        if (!sa) return -1;
        if (!sb) return 1;
        return (sa.history?.length || 0) - (sb.history?.length || 0);
      });
    }

    pool = shuffle(pool);
    return pool.slice(0, Math.min(targetCount, pool.length));
  }

  function startQuiz(n, sourceMode) {
    const pool = buildPool(sourceMode, n);
    if (pool.length === 0) return;
    setQuizQs(pool);
    setLength(pool.length);
    setIdx(0);
    setChosenIdx(null);
    setAnswers([]);
    setStartedAt(Date.now());
    setEndedAt(null);
    setPhase('running');
  }

  function chooseOption(i) {
    if (chosenIdx !== null) return; // lock after answer
    setChosenIdx(i);
    const q = quizQs[idx];
    const correct = i === q.correctIdx;

    // SR update: correct = solid, wrong = forgot
    const prior = quizBankState[q.id] || initialQuizBankItem();
    const graded = gradeReviewItem(prior, correct ? 'solid' : 'forgot');
    // Enrich the latest history entry with quiz-specific fields for Phase 3
    const enrichedHistory = [...(graded.history || [])];
    if (enrichedHistory.length > 0) {
      enrichedHistory[enrichedHistory.length - 1] = {
        ...enrichedHistory[enrichedHistory.length - 1],
        correct,
        chosenIdx: i,
        category: q.category,
        difficulty: q.difficulty,
      };
    }
    const updated = { ...graded, history: enrichedHistory };

    setQuizBankState(prev => ({ ...prev, [q.id]: updated }));
    setAnswers(prev => [...prev, { qId: q.id, chosenIdx: i, correct }]);
  }

  function nextQuestion() {
    if (idx + 1 >= quizQs.length) {
      setEndedAt(Date.now());
      setPhase('results');
    } else {
      setIdx(idx + 1);
      setChosenIdx(null);
    }
  }

  function exitToConfig() {
    setPhase('config');
    setQuizQs([]);
    setIdx(0);
    setChosenIdx(null);
    setAnswers([]);
  }

  // ── No questions for this course ──────────────────────────────────────────
  if (!questions || questions.length === 0) {
    return (
      <div className="rounded-2xl p-8 bg-ink-800/40 border border-white/5 text-center space-y-3">
        <div className="display-italic text-2xl text-ink-100">No scenarios yet for this course</div>
        <p className="text-sm text-ink-400 max-w-md mx-auto">
          {course?.info?.code ? (
            <>The <span className="font-mono text-ink-200">{course.info.code}</span> question bank is empty or not authored yet. Switch to another course in the Course view pill tabs, or contribute scenarios to <code className="text-ink-200">QUIZ_BANK</code>.</>
          ) : (
            <>No scenarios found. Add some to <code className="text-ink-200">QUIZ_BANK</code>.</>
          )}
        </p>
      </div>
    );
  }

  // ── Config screen ─────────────────────────────────────────────────────────
  if (phase === 'config') {
    const todayMs = startOfDay(new Date()).getTime();
    const seenCount = questions.filter(q => quizBankState[q.id]).length;
    const dueCount = questions.filter(q => {
      const s = quizBankState[q.id];
      if (!s) return true;
      if (s.retired) return false;
      return new Date(s.nextDue).getTime() <= todayMs;
    }).length;
    const masteredCount = questions.filter(q => {
      const s = quizBankState[q.id];
      return s && s.interval >= 14;
    }).length;

    // Phase 3 — use the mastery engine for readiness + weak-spots visibility
    const readiness = computeReadinessForCourse(quizBankState, courseId);
    const weakestCats = getWeakestCategories(quizBankState, courseId, 3);
    // Phase 4 additions
    const leeches = getLeeches(quizBankState, courseId);
    const rolling = getRollingAccuracy(quizBankState, courseId, 14);
    // Weak-spots mode is meaningful once we have genuine weaknesses OR enough
    // data that the mastery engine can meaningfully weight. Below 5 attempts
    // the weighting devolves into "all fresh" — the "All" mode does that better.
    const hasEnoughDataForWeak = readiness.attempts >= 5 && weakestCats.length > 0;

    // Readiness color ramp
    const readScore = readiness.score;
    const readColor = readScore >= 75 ? 'emerald'
                    : readScore >= 55 ? 'amber'
                    : readScore >= 30 ? 'orange'
                    :                   'rose';
    const readLabel = readiness.reason === 'no-data'      ? 'Baseline needed'
                    : readiness.reason === 'too-few'      ? 'Calibrating'
                    : readScore >= 75 ? 'Exam-ready'
                    : readScore >= 55 ? 'Close'
                    : readScore >= 30 ? 'Needs work'
                    :                   'Foundational';

    return (
      <div className="max-w-2xl mx-auto space-y-5">
        {/* Readiness panel — replaces the old simple stats row */}
        <div className={`rounded-2xl p-5 bg-${readColor}-500/10 border border-${readColor}-500/25 space-y-4`}>
          <div className="flex items-start justify-between gap-4 flex-wrap">
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 mb-0.5">
                <span className="small-caps text-ember-400 text-[11px]">{course?.info?.code || 'Scenarios'}</span>
                <span className="text-ink-500 text-[11px]">· readiness</span>
              </div>
              <div className="flex items-baseline gap-3">
                <span className={`display-italic text-5xl text-${readColor}-300`}>{readScore}</span>
                <span className={`text-${readColor}-200 text-sm`}>/ 100</span>
                <span className={`text-${readColor}-200 text-xs small-caps`}>{readLabel}</span>
              </div>
              <div className="text-[11px] text-ink-400 mt-1.5">
                {readiness.attempts === 0 ? (
                  <>Take a few scenarios to start your readiness score.</>
                ) : (
                  <>
                    {readiness.attempts} attempt{readiness.attempts !== 1 ? 's' : ''} ·
                    {' '}{readiness.covered}/{readiness.total} categor{readiness.covered === 1 ? 'y' : 'ies'} covered
                    {readiness.avgAccuracy != null && (
                      <> · {Math.round(readiness.avgAccuracy * 100)}% accuracy</>
                    )}
                  </>
                )}
              </div>
            </div>

            {/* Compact stats — seen/due/mastered as before, right-aligned */}
            <div className="flex gap-2 text-center">
              <div className="rounded-lg bg-ink-900/40 border border-white/5 px-2.5 py-1.5 min-w-[52px]">
                <div className="font-mono text-sm text-ink-50">{seenCount}</div>
                <div className="text-[9px] text-ink-400 uppercase tracking-wider">Seen</div>
              </div>
              <div className="rounded-lg bg-ember-500/10 border border-ember-500/20 px-2.5 py-1.5 min-w-[52px]">
                <div className="font-mono text-sm text-ember-300">{dueCount}</div>
                <div className="text-[9px] text-ember-400 uppercase tracking-wider">Due</div>
              </div>
              <div className="rounded-lg bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1.5 min-w-[52px]">
                <div className="font-mono text-sm text-emerald-300">{masteredCount}</div>
                <div className="text-[9px] text-emerald-400 uppercase tracking-wider">Done</div>
              </div>
              {leeches.length > 0 && (
                <div className="rounded-lg bg-rose-500/10 border border-rose-500/25 px-2.5 py-1.5 min-w-[52px]"
                     title={`${leeches.length} question${leeches.length !== 1 ? 's' : ''} failed ${LEECH_FAIL_THRESHOLD}+ times`}>
                  <div className="font-mono text-sm text-rose-300">{leeches.length}</div>
                  <div className="text-[9px] text-rose-400 uppercase tracking-wider">Leech</div>
                </div>
              )}
            </div>
          </div>

          {/* 14-day trend sparkline — only rendered once we have at least one attempt */}
          {readiness.attempts > 0 && (
            <div className="pt-3 border-t border-white/5 flex items-center gap-3">
              <div className={`text-[10px] small-caps text-${readColor}-300/80 shrink-0`}>
                14-day trend
              </div>
              <div className={`text-${readColor}-400 shrink-0`}>
                <Sparkline
                  data={rolling}
                  width={180}
                  height={28}
                  accentColor={
                    readColor === 'emerald' ? 'rgb(110 231 183)' :
                    readColor === 'amber'   ? 'rgb(252 211 77)'  :
                    readColor === 'orange'  ? 'rgb(253 186 116)' :
                                              'rgb(253 164 175)'
                  }
                />
              </div>
              <div className="text-[10px] text-ink-500 ml-auto shrink-0">
                {(() => {
                  const activeDays = rolling.filter(d => d.attempts > 0).length;
                  const totalAttempts = rolling.reduce((a, d) => a + d.attempts, 0);
                  return activeDays === 0
                    ? 'No attempts in last 14 days'
                    : `${totalAttempts} attempt${totalAttempts !== 1 ? 's' : ''} across ${activeDays} day${activeDays !== 1 ? 's' : ''}`;
                })()}
              </div>
            </div>
          )}

          {/* Weak areas detail — shown once we have enough data */}
          {weakestCats.length > 0 && (
            <div className="pt-3 border-t border-white/5">
              <div className="small-caps text-ink-400 text-[10px] mb-2">Weakest areas</div>
              <div className="flex flex-wrap gap-2">
                {weakestCats.map(c => {
                  const label = AWS_CATEGORIES.find(x => x.id === c.category)?.label || c.category;
                  const accPct = Math.round(c.accuracy * 100);
                  const pillColor = c.status === 'weak' ? 'rose' : 'amber';
                  return (
                    <span key={c.category}
                      className={`text-[11px] px-2.5 py-1 rounded-full bg-${pillColor}-500/10 border border-${pillColor}-500/25 text-${pillColor}-200`}
                      title={`${c.attempts} attempts · last seen ${c.lastSeen ? new Date(c.lastSeen).toLocaleDateString() : 'never'}`}
                    >
                      {label} <span className="font-mono opacity-70 ml-1">{accPct}%</span>
                    </span>
                  );
                })}
              </div>
            </div>
          )}
        </div>

        <div className="rounded-2xl p-6 bg-ink-800/40 border border-white/5 space-y-5">
          <div>
            <div className="display-italic text-2xl text-ink-50 mb-1">Scenario Quiz</div>
            <p className="text-sm text-ink-400 leading-relaxed">
              Exam-style scenarios with authored explanations. Correct answers solidify in
              spaced-repetition; wrong answers come back tomorrow. Weak-spots mode adapts
              to your performance.
            </p>
          </div>

          {/* Source selector */}
          <div>
            <div className="small-caps text-ink-400 text-[11px] mb-2">Question source</div>
            <div className="flex gap-1 p-1 rounded-full bg-ink-900/60 border border-white/5 w-fit flex-wrap">
              {[
                { id: 'all',   label: 'All', available: true },
                { id: 'due',   label: `Due${dueCount ? ` · ${dueCount}` : ''}`, available: dueCount > 0 },
                { id: 'fresh', label: 'Fresh / unseen first', available: true },
                { id: 'weak',  label: '🎯 Weak spots', available: hasEnoughDataForWeak, badge: 'adaptive' },
              ].map(s => (
                <button
                  key={s.id}
                  onClick={() => s.available && setSource(s.id)}
                  disabled={!s.available}
                  title={s.id === 'weak' && !s.available
                    ? 'Needs 5+ scenario attempts and at least one weak category before Weak Spots unlocks'
                    : ''}
                  className={`px-3 py-1 text-xs font-medium rounded-full transition ${
                    source === s.id ? 'bg-ink-50 text-ink-900' : 'text-ink-200 hover:text-ink-50'
                  } ${!s.available ? 'opacity-30 cursor-not-allowed' : ''}`}
                >{s.label}</button>
              ))}
            </div>
            {source === 'weak' && (
              <div className="mt-2 text-[11px] text-rose-300/80 leading-relaxed">
                Adaptive mix: ~60% from your weakest categories
                ({weakestCats.slice(0, 3).map(c => AWS_CATEGORIES.find(x => x.id === c.category)?.label).filter(Boolean).join(', ') || '—'}),
                ~25% due today, ~15% fresh.
              </div>
            )}
          </div>

          {/* Length presets */}
          <div>
            <div className="small-caps text-ink-400 text-[11px] mb-2">Length</div>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
              {[
                { n: 5,  label: 'Warmup',  sub: '~5 min' },
                { n: 10, label: 'Standard', sub: '~12 min' },
                { n: 20, label: 'Deep',    sub: '~25 min' },
              ].map(opt => {
                const avail = source === 'due' ? Math.min(opt.n, dueCount) : Math.min(opt.n, questions.length);
                const disabled = avail === 0;
                return (
                  <button
                    key={opt.n}
                    onClick={() => startQuiz(opt.n, source)}
                    disabled={disabled}
                    className={`p-4 rounded-xl border text-left transition-all ${
                      disabled
                        ? 'bg-ink-800/20 border-white/5 text-ink-600 cursor-not-allowed'
                        : 'bg-ink-800/60 border-white/10 hover:border-ember-500/40 hover:bg-ink-800 text-ink-100'
                    }`}
                  >
                    <div className="flex items-baseline justify-between gap-2">
                      <span className="display-italic text-lg">{opt.label}</span>
                      <span className="text-[10px] text-ink-400">{opt.sub}</span>
                    </div>
                    <div className="text-[11px] text-ink-400 mt-1">
                      {avail} question{avail === 1 ? '' : 's'}
                    </div>
                  </button>
                );
              })}
            </div>
          </div>

          <div className="text-[11px] text-ink-500 pt-3 border-t border-white/5 leading-relaxed">
            <strong className="text-ink-400">How grading works:</strong> correct answer = SR interval doubles (up to {SR_MAX_INTERVAL}d cap).
            Wrong answer = the question returns tomorrow. Your per-question history is saved locally and used to
            surface weak areas.
          </div>
        </div>
      </div>
    );
  }

  // ── Results screen ────────────────────────────────────────────────────────
  if (phase === 'results') {
    const correctCount = answers.filter(a => a.correct).length;
    const pct = Math.round((correctCount / answers.length) * 100);
    const elapsed = Math.round(((endedAt || Date.now()) - startedAt) / 1000);
    const mins = Math.floor(elapsed / 60);
    const secs = elapsed % 60;

    // Per-category breakdown from this session
    const catBreakdown = {};
    for (const a of answers) {
      const q = QUIZ_BANK_BY_ID[a.qId];
      if (!q) continue;
      if (!catBreakdown[q.category]) catBreakdown[q.category] = { correct: 0, total: 0 };
      catBreakdown[q.category].total++;
      if (a.correct) catBreakdown[q.category].correct++;
    }
    const catRows = Object.entries(catBreakdown)
      .map(([cat, v]) => ({ cat, ...v, pct: v.correct / v.total }))
      .sort((a, b) => a.pct - b.pct);

    const scoreColor = pct >= 80 ? 'emerald' : pct >= 65 ? 'amber' : 'rose';

    return (
      <div className="max-w-3xl mx-auto space-y-4">
        <div className={`rounded-2xl p-6 bg-${scoreColor}-500/10 border border-${scoreColor}-500/30 text-center`}>
          <div className={`display-italic text-5xl text-${scoreColor}-300 mb-1`}>{pct}%</div>
          <div className={`text-sm text-${scoreColor}-200`}>
            {correctCount} / {answers.length} correct · {mins}m {secs}s
          </div>
        </div>

        {/* Per-category breakdown */}
        {catRows.length > 1 && (
          <div className="rounded-2xl p-5 bg-ink-800/40 border border-white/5 space-y-3">
            <div className="small-caps text-ink-400 text-[11px]">Breakdown by category</div>
            <div className="space-y-2">
              {catRows.map(r => {
                const label = AWS_CATEGORIES.find(c => c.id === r.cat)?.label || r.cat;
                const accentClass = r.pct >= 0.8 ? 'bg-emerald-500' : r.pct >= 0.6 ? 'bg-amber-500' : 'bg-rose-500';
                return (
                  <div key={r.cat} className="flex items-center gap-3">
                    <div className="w-32 text-sm text-ink-200 truncate">{label}</div>
                    <div className="flex-1 h-1.5 bg-ink-900/50 rounded-full overflow-hidden">
                      <div className={`h-full rounded-full ${accentClass}`} style={{ width: `${r.pct * 100}%` }} />
                    </div>
                    <div className="font-mono text-xs text-ink-300 w-16 text-right">{r.correct}/{r.total}</div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* Actions */}
        <div className="flex flex-wrap gap-2 justify-center">
          <button
            onClick={() => startQuiz(length, source)}
            className="px-4 py-2 rounded-full bg-ember-500 text-ink-900 font-semibold hover:bg-ember-400"
          >Another round of {length}</button>
          <button
            onClick={exitToConfig}
            className="px-4 py-2 rounded-full border border-white/10 hover:border-white/25 text-ink-100"
          >Change length</button>
        </div>

        {/* Leeches — questions that have been failed 4+ times. The reset
            button wipes SR state for that question so it's re-learned fresh. */}
        {(() => {
          // Recompute leeches from the post-session quizBankState
          const postLeeches = getLeeches(quizBankState, courseId);
          if (postLeeches.length === 0) return null;
          return (
            <div className="rounded-2xl p-4 bg-rose-500/[0.06] border border-rose-500/20 space-y-3">
              <div className="flex items-baseline justify-between">
                <div>
                  <div className="small-caps text-rose-300 text-[11px]">Leeches</div>
                  <div className="text-xs text-ink-300">
                    {postLeeches.length} question{postLeeches.length !== 1 ? 's' : ''} failed {LEECH_FAIL_THRESHOLD}+ times. Reset clears SR state so you relearn fresh.
                  </div>
                </div>
              </div>
              <div className="space-y-1.5">
                {postLeeches.slice(0, 5).map(l => (
                  <div key={l.question.id} className="flex items-center gap-2 text-xs">
                    <span className="font-mono text-rose-400 shrink-0">{l.wrongCount}✕</span>
                    <span className="text-ink-200 truncate flex-1 min-w-0" title={l.question.stem}>
                      {(l.question.stem || '').slice(0, 90)}{(l.question.stem || '').length > 90 ? '…' : ''}
                    </span>
                    <button
                      onClick={() => {
                        if (!confirm(`Reset SR state for this question?\n\nIts history stays in your stats; only the spaced-repetition schedule resets.`)) return;
                        setQuizBankState(prev => {
                          const next = { ...prev };
                          delete next[l.question.id];
                          return next;
                        });
                      }}
                      className="shrink-0 px-2 py-0.5 rounded border border-rose-500/30 text-rose-300 hover:bg-rose-500/15 hover:text-rose-100 text-[11px]"
                      title="Reset spaced-repetition state"
                    >Reset</button>
                  </div>
                ))}
                {postLeeches.length > 5 && (
                  <div className="text-[10px] text-ink-400 italic">…and {postLeeches.length - 5} more</div>
                )}
              </div>
            </div>
          );
        })()}

        {/* Review all answers — shows each question with user's answer + correct answer + explanation */}
        <div className="space-y-3 pt-4">
          <div className="small-caps text-ink-400 text-[11px]">Review all {answers.length}</div>
          {answers.map((a, i) => {
            const q = QUIZ_BANK_BY_ID[a.qId];
            if (!q) return null;
            const isCorrect = a.correct;
            const itemState = quizBankState[q.id];
            const questionIsLeech = isLeech(itemState);
            return (
              <div key={i} className={`rounded-2xl p-4 bg-ink-800/30 border space-y-2 ${
                isCorrect ? 'border-emerald-500/20' : 'border-rose-500/25'
              }`}>
                <div className="flex items-center gap-2 flex-wrap">
                  <span className={`text-[10px] uppercase tracking-wider font-semibold px-2 py-0.5 rounded ${
                    isCorrect ? 'bg-emerald-500/15 text-emerald-300' : 'bg-rose-500/15 text-rose-300'
                  }`}>
                    {isCorrect ? '✓ Correct' : '✕ Wrong'}
                  </span>
                  <span className="text-[10px] text-ink-500">#{i + 1}</span>
                  <span className="text-[10px] px-1.5 py-0.5 rounded bg-ink-900/60 text-ink-400 border border-white/5">
                    {AWS_CATEGORIES.find(c => c.id === q.category)?.label || q.category}
                  </span>
                  {questionIsLeech && (
                    <span className="text-[10px] uppercase tracking-wider font-semibold px-2 py-0.5 rounded bg-rose-500/20 border border-rose-500/40 text-rose-200"
                          title={`This question has been failed ${itemState.history.filter(h => h.correct === false).length} times`}>
                      🪱 Leech
                    </span>
                  )}
                </div>
                <div className="text-sm text-ink-100 leading-relaxed">{q.stem}</div>
                <div className="flex flex-wrap gap-2 text-xs">
                  {!isCorrect && (
                    <span className="px-2 py-1 rounded bg-rose-500/10 border border-rose-500/25 text-rose-200">
                      You: <RichText text={q.options[a.chosenIdx]} />
                    </span>
                  )}
                  <span className="px-2 py-1 rounded bg-emerald-500/10 border border-emerald-500/25 text-emerald-200">
                    Correct: <RichText text={q.options[q.correctIdx]} />
                  </span>
                </div>
                <div className="pt-2 mt-2 border-t border-white/5 text-xs text-ink-300 leading-relaxed">
                  <RichText text={q.explanation} />
                </div>
                <div className="text-[11px]">
                  <a href={q.docUrl} target="_blank" rel="noopener noreferrer"
                     className="text-ember-400 hover:text-ember-300">AWS docs ↗</a>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // ── Running quiz ──────────────────────────────────────────────────────────
  const q = quizQs[idx];
  const answered = chosenIdx !== null;
  const isCorrect = answered && chosenIdx === q.correctIdx;

  return (
    <div className="max-w-3xl mx-auto space-y-4">
      {/* Progress bar */}
      <div className="flex items-center gap-3">
        <div className="flex-1 h-1 bg-ink-700 rounded-full overflow-hidden">
          <div
            className="h-full bg-ember-500 transition-all"
            style={{ width: `${((idx + (answered ? 1 : 0)) / quizQs.length) * 100}%` }}
          />
        </div>
        <span className="text-xs text-ink-400 font-mono">{idx + 1} / {quizQs.length}</span>
        <button
          onClick={() => { if (confirm('Quit this quiz? Answered questions have already been saved.')) exitToConfig(); }}
          className="text-xs text-ink-500 hover:text-ink-300"
          title="Quit"
        >✕</button>
      </div>

      {/* Stem */}
      <div className="rounded-2xl p-5 bg-ink-800/40 border border-white/5 space-y-3">
        <div className="flex items-center gap-2">
          <span className="text-xs text-ink-400">Question {idx + 1}:</span>
          <span className={`text-[10px] uppercase tracking-wider px-2 py-0.5 rounded border ${
            q.difficulty === 'easy'   ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-300' :
            q.difficulty === 'medium' ? 'bg-amber-500/10  border-amber-500/20  text-amber-300' :
                                        'bg-rose-500/10   border-rose-500/25   text-rose-300'
          }`}>{q.difficulty}</span>
          <span className="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded bg-ink-900/60 text-ink-300 border border-white/5">
            {AWS_CATEGORIES.find(c => c.id === q.category)?.label || q.category}
          </span>
        </div>
        <div className="text-[15px] text-ink-100 whitespace-pre-line leading-relaxed">
          <RichText text={q.stem} />
        </div>
      </div>

      {/* Options — Tutorials Dojo style */}
      <div className="space-y-2">
        {q.options.map((opt, i) => {
          const isChosen = answered && i === chosenIdx;
          const isCorrectOpt = i === q.correctIdx;
          const showAsCorrect = answered && isCorrectOpt;
          const showAsWrong   = answered && isChosen && !isCorrectOpt;

          // Ring / background based on state
          let ring = 'border-white/10 hover:border-white/25 bg-ink-800/40';
          if (answered) {
            if (showAsCorrect)      ring = 'border-emerald-500/60 bg-emerald-500/[0.07]';
            else if (showAsWrong)   ring = 'border-rose-500/60 bg-rose-500/[0.07]';
            else                    ring = 'border-white/5 bg-ink-800/20 opacity-60';
          } else if (isChosen) {
            ring = 'border-ember-500/60 bg-ember-500/[0.08]';
          }

          // Radio circle state
          const radioFill = showAsCorrect ? 'bg-emerald-500 border-emerald-500'
                          : showAsWrong   ? 'bg-rose-500 border-rose-500'
                          : isChosen      ? 'bg-ember-500 border-ember-500'
                          :                 'border-white/25';

          return (
            <button
              key={i}
              onClick={() => chooseOption(i)}
              disabled={answered}
              className={`w-full text-left px-4 py-3 rounded-xl border transition-all ${ring} ${!answered ? 'cursor-pointer' : 'cursor-default'}`}
            >
              <div className="flex items-start gap-3">
                <span className={`shrink-0 w-5 h-5 rounded-full border-2 mt-0.5 flex items-center justify-center ${radioFill}`}>
                  {(showAsCorrect || showAsWrong || isChosen) && (
                    <span className="w-1.5 h-1.5 rounded-full bg-ink-50" />
                  )}
                </span>
                <div className="flex-1 min-w-0">
                  {/* Option text with bold segments */}
                  <div className="flex items-start justify-between gap-3">
                    <div className={`text-sm leading-relaxed ${
                      showAsCorrect ? 'text-emerald-100' :
                      showAsWrong   ? 'text-rose-100' :
                                      'text-ink-100'
                    }`}>
                      <RichText text={opt} />
                    </div>
                    {/* Feedback pill on the answered option(s) */}
                    {showAsCorrect && (
                      <span className="shrink-0 text-[11px] font-semibold text-emerald-300 flex items-center gap-1">
                        {isChosen ? 'Correct' : 'Correct answer'}
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12" /></svg>
                      </span>
                    )}
                    {showAsWrong && (
                      <span className="shrink-0 text-[11px] font-semibold text-rose-300 flex items-center gap-1">
                        Incorrect
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
                      </span>
                    )}
                  </div>

                  {/* Expanded explanation inside the user's chosen option.
                      If the user was correct, the chosen option IS the correct option, so show here.
                      If the user was wrong, show the explanation inside the WRONG option (so it's
                      attached to their mistake) AND the correct option gets a green ring above. */}
                  {answered && isChosen && (
                    <div className={`mt-3 pt-3 border-t text-[13px] leading-relaxed ${
                      isCorrect ? 'border-emerald-500/20 text-emerald-100/90' : 'border-rose-500/20 text-rose-100/90'
                    }`}>
                      <RichText text={q.explanation} />
                      <div className="mt-2">
                        <a href={q.docUrl} target="_blank" rel="noopener noreferrer"
                           className="text-ember-400 hover:text-ember-300 text-[12px]">
                          Verify on AWS docs ↗
                        </a>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </button>
          );
        })}
      </div>

      {/* Next button — only after answering */}
      {answered && (
        <div className="flex justify-end">
          <button
            onClick={nextQuestion}
            className="px-5 py-2 rounded-full bg-ember-500 text-ink-900 font-semibold hover:bg-ember-400 flex items-center gap-2"
          >
            {idx + 1 >= quizQs.length ? 'See results' : 'Next question'}
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
              <line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" />
            </svg>
          </button>
        </div>
      )}
    </div>
  );
}

// ============================================================================
// MOUNT
// ============================================================================

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
